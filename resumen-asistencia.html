<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 60px;}

  .falt-row .nm b{display:block;} .falt-row .nm small{color:var(--muted);font-size:11px;}

  .mini-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;margin-right:4px;}
  .mini-btn:hover{border-color:var(--accent);color:var(--accent-txt);}
  /* Buscador de CC (D78): mismo patrón visual que el del capataz, pero sobre TODO el catálogo */

  .cc-results{position:absolute;top:100%;left:0;right:0;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;max-height:240px;overflow-y:auto;z-index:30;margin-top:4px;}
  .cc-opt{padding:8px 12px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border);}
  .cc-opt:last-child{border-bottom:none;}
  .cc-opt:hover{background:var(--surface2);color:var(--accent-txt);}
  .cc-head{padding:5px 12px;font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border);position:sticky;top:0;}
  /* Indicador de carga NO bloqueante (mismo tema oscuro/acento): barrita bajo el header + contenido
     atenuado. Al cambiar de fecha ya no se borra la pantalla: se sigue viendo el día anterior hasta
     que llega el nuevo. */
  .loadbar{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(245,166,35,0.15);overflow:hidden;z-index:30;display:none;}
  .loadbar.on{display:block;}
  .loadbar::after{content:'';position:absolute;top:0;left:0;height:100%;width:38%;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);animation:loadslide 1.05s linear infinite;}
  @keyframes loadslide{0%{transform:translateX(-100%);}100%{transform:translateX(365%);}}
  .cargando{opacity:0.5;transition:opacity .15s ease;pointer-events:none;}

  /* ===== PC (D151) — dos columnas ====================================
   * Izquierda el día (cuadrillas, notas, faltantes); derecha las herramientas
   * (Excel Navision y gestión de personal). El seguimiento de ausencias no
   * entra aquí: vive fuera de #container, así que se queda a ancho completo
   * por sí solo, que es lo que le conviene — tiene su propia tabla.
   * `display:contents` deja el orden del teléfono intacto.
   * ================================================================== */
  .pc-zona,.pc-izq,.pc-der,.pc-pie,.pc-gestion{display:contents;}
  @media(min-width:1100px){
    .container{max-width:1240px;}
    /* min-width:0 en las celdas: sin él, un hijo ancho (la tabla de personal)
       ensancha su columna en vez de hacer scroll dentro, y descuadra la rejilla. */
    .pc-zona{display:grid;grid-template-columns:1.3fr 1fr;gap:0 20px;align-items:start;}
    .pc-izq{display:block;grid-column:1;grid-row:1;min-width:0;}
    .pc-der{display:block;grid-column:2;grid-row:1;min-width:0;}
    .pc-pie{display:block;grid-column:1 / -1;grid-row:2;min-width:0;}
    .pc-gestion{display:block;grid-column:1 / -1;grid-row:3;min-width:0;}
    .kpis{grid-template-columns:repeat(4,1fr);}
  }

  /* ===== Tabla de personal (D155) =========================================
   * Cinco columnas dentro de la columna estrecha de PC. El <select> de
   * cuadrilla heredaba `width:100%` de la regla global de arriba, así que en
   * una celda comprimida se quedaba en «JA▾» — el nombre de la cuadrilla no
   * se leía. Ahora el select tiene ancho propio y la tabla toma el suyo en vez
   * de encogerse; cuando no cabe, el contenedor que ya la envuelve hace scroll
   * horizontal en lugar de aplastar las columnas.
   * ====================================================================== */
  #persTablaWrap table{width:auto;min-width:100%;}
  #persTablaWrap th,#persTablaWrap td{white-space:nowrap;}
  #persTablaWrap td:first-child{white-space:normal;min-width:160px;}   /* el nombre sí envuelve */
  #persTablaWrap select{
    width:auto;min-width:158px;font-size:12.5px;
    padding:6px 30px 6px 10px;background-position:right 10px center;
  }
  #persTablaWrap td{vertical-align:middle;}

<div class="loadbar" id="loadBar"></div>
<div class="header">

  <div class="header-user">
    <span id="userDisplay">—</span>
    <!-- D112: entrada a "Horas por persona" (horas-persona.html). Es la vista INVERSA de esta pantalla
         (una persona × un período, en vez de un día × todas las cuadrillas) y la usa la misma gente,

<!-- D133 — la barra de consulta vive FUERA de #container: el contenedor lo reconstruye `render()` con
     cada respuesta, y la barra tiene que estar en pantalla antes de que haya ninguna (y seguir estando
     si la consulta falla). Antes el campo de fecha se pintaba dentro del resumen, así que para cambiar
     de día había que esperar primero a que cargara el día que no querías ver. -->
<div class="container" id="barraConsulta" style="padding-bottom:0;"></div>
<div class="container" id="container">
  <div class="loading">⏳ Cargando…</div>
</div>

<script src="auth.js"></script>
<!-- D112 — Clasificador de horas COMPARTIDO con `horas-persona.html` (clasificarHoras, turnoRowFor,
     tipoJornadaDeFecha, jornadaPorDefecto, horasNum, ovlp, round2). Estaba en línea en este archivo;
     se extrajo sin cambiar la lógica para que la pantalla de reclamos de pago dé los mismos números
     que el Parte de Navision. Tiene que ir ANTES del script de la página. -->
<script src="horas-nomina.js"></script>
<script>
const APPS_SCRIPT_URL = GALCA_ENV.url.asistencias;   // entorno.js (D168): producción o prueba

/* ================= INSTRUMENTACIÓN DE RENDIMIENTO (temporal) =================
 * Para medir el antes/después con F12 → Console. Apagar poniendo DEBUG_PERF=false (una línea).
 * Mide cada petición al Apps Script (ida y vuelta + tamaño de la respuesta) y el pintado, y saca un
 * console.table al final de cada ciclo. Si el backend llega a devolver `_ms` (tiempo de servidor,
 * Fase 2), la tabla lo muestra en su propia columna para separar Apps Script de red/arranque. */
const DEBUG_PERF = true;
/* D132 — SONDAS DE RED. `red_ms` (= total − `_ms` del servidor) mete en un solo número tres cosas muy
 * distintas: el ARRANQUE del contenedor de Apps Script (que ocurre ANTES de que `doGet` siembre `_t0`,
 * así que es invisible para `_ms`), la REDIRECCIÓN de `/exec` a `script.googleusercontent.com` (una
 * segunda conexión completa: DNS + TCP + TLS) y la DESCARGA de la respuesta. Con 18,9 s medidos en
 * campo —2,1 de servidor y 16,8 de "red" para 99 KB— hay que saber cuál de las tres manda antes de
 * tocar nada.
 * Cómo se separan: dos idas y vueltas VACÍAS (una acción que el backend no reconoce contesta
 * `{ok:true,msg:'API Asistencias viva'}` sin leer una sola celda), una ANTES de la petición real —que
 * paga el arranque si el contenedor estaba frío— y otra DESPUÉS —con el contenedor ya caliente—.
 *     arranque      ≈ sonda 1 − sonda 2
 *     ida y vuelta  ≈ sonda 2            (redirección + latencia, con carga útil ~0)
 *     transferencia ≈ red_ms − sonda 2   (lo que de verdad cuestan los 99 KB)
 * Cuesta dos peticiones vacías por carga: se APAGA (false) en cuanto la medición esté hecha.
 * MEDIDO ya (ago-2026, dos capturas en campo): la ida y vuelta VACÍA cuesta 1,2–2,6 s en la conexión de
 * obra, el arranque del contenedor es despreciable (~0–430 ms) y el resto es transferencia — 99,2 KB a
 * ~8,6 KB/s = 11,5 s. Con eso respondido, las sondas se apagan: en esa red cuestan 5 s por carga y dos
 * oportunidades más de que la petición se caiga. Se vuelven a encender si hay que remedir. */
const DEBUG_SONDA = false;
const PERF = [];
function ahora(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
function perfReset(){ PERF.length=0; }
// fetch + JSON con cronómetro. Devuelve el objeto ya parseado (mismo contrato que resp.json()).
async function perfFetch(label, url, opts){
  const t0=ahora(); let cerrado=false;
  if(DEBUG_PERF) console.time('⏱ '+label);
  const cerrar=()=>{ if(DEBUG_PERF && !cerrado){ cerrado=true; console.timeEnd('⏱ '+label); } };
  try{
    const resp=await fetch(url, opts);
    const txt=await resp.text();
    const ms=Math.round(ahora()-t0);
    cerrar();
    let data=null, err=null;
    try{ data=JSON.parse(txt); }catch(e){ err=e; }
    if(DEBUG_PERF){
      const reg={ peticion:label, ms, kb:Math.round(txt.length/102.4)/10 };
      // `red_ms` = lo que NO fue Apps Script (arranque del contenedor, redirección de /exec, red y
      // descarga). Se acota a 0: si los dos relojes discrepan podría salir negativo y confundir.
      if(data && data._ms!=null){ reg.servidor_ms=Number(data._ms); reg.red_ms=Math.max(0, ms-Number(data._ms)); }
      // D132 — `_celdas` (D102) ya viaja en toda respuesta y nadie lo miraba. Es lo que separa un
      // `servidor_ms` alto por LEER el Sheet de uno alto por procesar/servir catálogos desde el caché:
      // una lectura servida por CacheService suma 0 celdas. Con la hoja inflada, el escaneo de la
      // columna `fecha` (1 celda por fila del histórico) se ve aquí y en ningún otro sitio.
      if(data && data._celdas!=null) reg.celdas=Number(data._celdas);
      PERF.push(reg);
      perfPayload(label, txt, data);
    }
    /* D133b — UNA respuesta que no es JSON puede ser DOS cosas muy distintas, y hasta aquí las dos
     * salían como "el Apps Script no contestó en JSON", que en una de ellas es falso:
     *   · Empieza por `{` o `[` -> era JSON y llegó CORTADO. El servidor contestó bien; lo que falló
     *     fue la descarga. Con ~100 KB a 6–16 KB/s eso son 6–16 s de línea abierta, y cortarse a mitad
     *     es lo más normal del mundo en esa red. Se trata como fallo de RED: se reintenta.
     *   · Empieza por `<` (o llega vacía) -> es una página HTML de Google: implementación caída, a
     *     medio redesplegar, o la sesión pidiendo iniciar sesión. Ahí sí hay que mirar el Apps Script.
     * El principio del cuerpo viaja en el error para no tener que adivinar cuál de los dos fue. */
    if(err){
      const crudo=String(txt||'').replace(/\s+/g,' ').trim();
      const e2=new Error(crudo ? 'La respuesta no se pudo leer como JSON.' : 'El servidor contestó vacío.');
      e2.cortada=/^[\[{]/.test(crudo);       // era JSON y se quedó a medias
      // D133c — de una página de Google, el markup crudo no dice NADA: los primeros 120 caracteres son
      // siempre `<!DOCTYPE html><html><head><script nonce=…`, igual para un error temporal, una cuota
      // agotada o una pantalla de permisos. Lo que distingue un caso de otro es el TEXTO VISIBLE, que
      // está más abajo. Se quitan script/style/tags y se enseña eso, que es el diagnóstico de verdad.
      e2.cuerpo = e2.cortada ? crudo.slice(0,120) : (function(){
        const texto=crudo.replace(/<script[\s\S]*?<\/script>/gi,' ')
                         .replace(/<style[\s\S]*?<\/style>/gi,' ')
                         .replace(/<[^>]+>/g,' ')
                         .replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
        return texto ? texto.slice(0,240) : crudo.slice(0,120);
      })();
      throw e2;
    }
    return data;
  }catch(e){ cerrar(); throw e; }
}
function perfMarca(label, ms){ if(DEBUG_PERF) PERF.push({ peticion:label, ms:Math.round(ms) }); }
/* D132 — QUÉ pesa dentro de la respuesta, no solo cuánto. Los KB totales no dicen si el problema son
 * las filas del día (crecen con la gente) o los CATÁLOGOS (`catCC`, `catMotivos`, `turnos`, `festivos`,
 * `config`), que son casi estáticos y viajan enteros en CADA cambio de fecha. Solo se imprime por
 * encima de 20 KB, que es donde la diferencia empieza a notarse en una conexión de obra. */
const PERF_DESGLOSE_MIN_KB = 20;
let PERF_DESGLOSE = null;   // se imprime al final, junto a la tabla grande, para poder capturarlo todo de una
function perfPayload(label, txt, data){
  if(!data || typeof data!=='object' || txt.length < PERF_DESGLOSE_MIN_KB*1024) return;
  // D133 — en una lista MIXTA se dice cuántos vinieron como índice y cuántos como texto. Es lo que
  // permite ver de un vistazo cuántos CC de CC_USADOS no están en CAT_CC (los que no casan viajan como
  // string y son los únicos que siguen pesando).
  const cuantos=a=>{
    if(!a.length) return 0;
    const n=a.filter(v=>typeof v==='number').length;
    return (n && n<a.length) ? a.length+' ('+n+' índices, '+(a.length-n)+' texto)' : a.length;
  };
  const filas=Object.keys(data).map(k=>{
    let n=0; try{ n=JSON.stringify(data[k]).length; }catch(err){ n=0; }
    const v=data[k];
    // D133d: `filas`/`faltantes` llegan como {cols, datos} — se cuentan las filas, no las dos claves.
    const elems = Array.isArray(v) ? cuantos(v)
                : (v && Array.isArray(v.datos) ? v.datos.length+' × '+(v.cols||[]).length+' col' : '');
    return { clave:k, kb:Math.round(n/102.4)/10, pct:Math.round(n*100/txt.length)+'%', elementos:elems };
  }).filter(r=>r.kb>=0.5).sort((a,b)=>b.kb-a.kb);
  PERF_DESGLOSE={ label:label, kb:Math.round(txt.length/102.4)/10, filas:filas };
}
/* D132 — reparto del tiempo entre arranque del contenedor, ida y vuelta y transferencia (ver DEBUG_SONDA). */
function perfSondas(){
  const buscar=t=>PERF.filter(r=>r.peticion.indexOf(t)===0)[0];
  const fria=buscar('sonda 1'), caliente=buscar('sonda 2'), real=buscar('asistencia (día)');
  if(!caliente || !real || real.red_ms==null || caliente.red_ms==null) return;
  // Las tres restas van sobre `red_ms`, NUNCA sobre el total: el total de una sonda incluye su propio
  // `servidor_ms` (~100-230 ms solo por arrancar el script y verificar el token), así que restarlo
  // contra el `red_ms` de la petición real mezclaba dos magnitudes y subestimaba la transferencia.
  const arranque = fria && fria.red_ms!=null ? Math.max(0, fria.red_ms - caliente.red_ms) : null;
  const transfer = Math.max(0, real.red_ms - caliente.red_ms);
  console.log('%c   ↳ reparto de los '+real.ms+' ms: servidor '+real.servidor_ms+' ms · ida y vuelta vacía '
    + caliente.red_ms+' ms (redirección de /exec + latencia) · transferencia de los '+(real.kb||'?')+' KB ~'+transfer+' ms'
    + (arranque!=null ? '   [arranque extra del contenedor frío: ~'+arranque+' ms]' : ''),
    'color:#8aa');
}
function perfTabla(ctx){
  if(!DEBUG_PERF || !PERF.length) return;
  const total=PERF.reduce((a,r)=>a+(r.ms||0),0);
  console.log('%c⏱ resumen-asistencia · '+ctx+' · '+PERF.filter(r=>r.kb!=null).length+' petición(es) · '+Math.round(total)+' ms',
    'color:#f5a623;font-weight:700');
  console.table(PERF.slice());
  perfSondas();
  if(PERF_DESGLOSE){
    console.log('%c   ↳ desglose de «'+PERF_DESGLOSE.label+'» ('+PERF_DESGLOSE.kb+' KB) — qué se lleva los bytes',

async function sondaRed(label){
  if(!DEBUG_PERF || !DEBUG_SONDA) return;

/* SheetJS bajo demanda: solo hace falta para generar el Excel Navision. Cargarlo en el <head>
 * bloqueaba el primer pintado del resumen con ~900 KB que la mayoría de las visitas no usa. Se
 * inyecta al pulsar "Excel 3701/3702" (y, si el navegador queda ocioso, se precarga en segundo plano
 * para que el primer clic tampoco espere). Misma librería/versión de siempre. */
const XLSX_SRC='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let _xlsxProm=null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(_xlsxProm) return _xlsxProm;
  const t0=ahora();
  _xlsxProm=new Promise(function(res, rej){
    const s=document.createElement('script');
    s.src=XLSX_SRC; s.async=true;
    s.onload=function(){ perfMarca('SheetJS (carga)', ahora()-t0); res(window.XLSX); };
    s.onerror=function(){ _xlsxProm=null; rej(new Error('No se pudo cargar la librería de Excel (SheetJS). Revisa la conexión.')); };
    document.head.appendChild(s);
  });
  return _xlsxProm;
}
// Trabajo diferido a cuando el navegador esté ocioso (con respaldo por si no hay requestIdleCallback).

// Plantilla recordada entre sesiones (localStorage): así solo se sube UNA vez, no cada sesión. Se
// guarda como base64 del .xlsx. Si es demasiado grande para localStorage, cae a "solo esta sesión".
function ab2b64(buf){ let bin=''; const b=new Uint8Array(buf), ch=0x8000; for(let i=0;i<b.length;i+=ch) bin+=String.fromCharCode.apply(null, b.subarray(i,i+ch)); return btoa(bin); }
function b642ab(b64){ const bin=atob(b64), n=bin.length, b=new Uint8Array(n); for(let i=0;i<n;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
function restaurarPlantilla(){
  try{
    const b=localStorage.getItem('asis_tpl_b64'); if(!b) return;
    STATE.tplBuf=b642ab(b); STATE.tplName=localStorage.getItem('asis_tpl_name')||'plantilla recordada'; STATE.tplRecordada=true;
    const fi=parseInt(localStorage.getItem('asis_tpl_fila')); if(fi>=2) STATE.filaInicio=fi;
  }catch(e){}
}
function olvidarPlantilla(){
  STATE.tplBuf=null; STATE.tplName=''; STATE.tplRecordada=false; STATE.tplBundle=false;
  try{ localStorage.removeItem('asis_tpl_b64'); localStorage.removeItem('asis_tpl_name'); localStorage.removeItem('asis_tpl_fila'); }catch(e){}
  render();
  cargarPlantillaBundle(); // si hay plantilla incluida en el repo, vuelve a tomarla
}
// Plantilla incluida en el repo: la app busca `plantilla_parte.xlsx` junto al HTML. Si existe, la usa
// sola (sin que el usuario suba nada). Si no está (404) o no es un .xlsx válido, cae al modo subir.
// D101: la plantilla incluida depende del ÁREA que se revisa. Las de 3701 y 3703 tienen la misma
// estructura (7 hojas, Parte de 18 columnas A–R, mismo listado de Trabajadores) pero NO el mismo
// catálogo de `Centros de coste` ni la misma hoja `Proyectos`, así que exportar UF3 con la plantilla de
// tierras metería el Parte en un libro con los CC del 3701. El generador solo llena la hoja `Parte` y
// conserva las demás intactas: por eso el libro de partida tiene que ser el del proyecto correcto.
function plantillaBundleUrl(){
  const esUF3 = STATE.rol==='asistencia_plus_uf3' || (STATE.rol==='admin' && STATE.areaFiltro==='uf3');
  return esUF3 ? 'plantilla_parte_uf3.xlsx' : 'plantilla_parte.xlsx';
}
async function cargarPlantillaBundle(){
  if(STATE.tplBuf) return; // ya hay una (recordada o subida esta sesión)
  try{
    const resp=await fetch(plantillaBundleUrl(), {cache:'no-store'});
    if(!resp.ok) return;
    const buf=await resp.arrayBuffer();
    const sig=new Uint8Array(buf.slice(0,2));            // un .xlsx es un ZIP: empieza con 'PK' (0x50 0x4B)
    if(sig[0]!==0x50 || sig[1]!==0x4B) return;           // 404 servido como HTML u otro archivo -> ignora
    STATE.tplBuf=buf; STATE.tplName=plantillaBundleUrl(); STATE.tplBundle=true; STATE.tplRecordada=false;
    if(STATE.data) render();
  }catch(e){}
}

// Indicador de carga NO bloqueante: barrita de progreso bajo el borde del header y contenido atenuado.
// Al cambiar de fecha ya NO se borra la pantalla — el día anterior sigue a la vista hasta que llega el
// nuevo, así el cambio se siente instantáneo aunque el Apps Script tarde.
function loadBar(on){
  const b=document.getElementById('loadBar'); if(b) b.classList.toggle('on', !!on);
  const c=document.getElementById('container'); if(c) c.classList.toggle('cargando', !!on && !!STATE.data);

/* ============ D132 — "No se pudo consultar. Revisa el Apps Script." ============
 * Ese mensaje era el MISMO para cuatro causas que no tienen nada que ver entre sí, y encima señalaba
 * a la equivocada: en tres de los cuatro casos el Apps Script no tiene ninguna culpa. Las cuatro, con
 * lo que de verdad hay que hacer en cada una:
 *   · SESIÓN CADUCADA — el backend contesta `{ok:false, auth:false}` cuando el token falta, viene
 *     alterado o quedó fuera por `AUTH_V` (D109). Se arregla volviendo a entrar, y nada más. `auth.js`
 *     expone `TM2Auth.caducada(data)` justo para esto desde D109, con un comentario que dice que «las
 *     pantallas de consolidación lo usan para mandar al login en vez de mostrar un error críptico»…
 *     y resulta que NINGUNA pantalla lo llamaba. Este es el primer sitio donde se usa.
 *   · CONEXIÓN CORTADA — `fetch` rechaza con TypeError cuando la petición no llega a completarse. A
 *     los ~8,6 KB/s medidos en obra, los ~100 KB de esta pantalla tardan más de 10 s y que el enlace
 *     se caiga a mitad es rutina, no una avería. Un GET es idempotente, así que se REINTENTA una vez
 *     sola antes de rendirse, y el mensaje ofrece reintentar a mano.
 *   · RESPUESTA NO-JSON — implementación caída o Google pidiendo iniciar sesión. Aquí sí se mira el
 *     Apps Script.
 *   · RECHAZO DEL BACKEND (`ok:false` con motivo) — se muestra el motivo tal cual, que ya viene
 *     escrito para que lo lea el usuario (fecha inválida de D106, cerrojo ocupado de D125…).
 */
function esFalloDeRed(e){
  // Un `ok:false` del backend NO pasa por aquí: eso es una respuesta, no un fallo de red.
  // D133b: una respuesta JSON que llegó cortada es un fallo de red aunque el servidor contestara bien.
  return !!e && (e instanceof TypeError || e.cortada === true
    || /failed to fetch|load failed|networkerror|network request/i.test(String((e && e.message) || '')));
}
/* D133b — TRES intentos, no dos. El `?action=ping` del despliegue contesta en 48 ms con JSON perfecto:
 * el servidor está sano y la conexión se establece bien. Lo que a veces no aguanta es mantener abierta
 * una descarga de 6-16 s. Contra eso, insistir es lo que funciona — el GET es idempotente y cada
 * intento es independiente, así que basta con que UNO llegue entero.
 * La espera entre intentos es corta y creciente (no es un servidor saturado al que haya que dar tregua;
 * es una señal que va y viene), y se avisa en pantalla para que no parezca colgado. */
const REINTENTOS = 3, ESPERA_MS = [0, 800, 2000];
function esperar(ms){ return new Promise(r=>setTimeout(r, ms)); }
/* D133c — una página de Google TAMBIÉN se reintenta, pero una sola vez. Los errores temporales del
 * servicio ("se ha producido un error", el contenedor que no arranca) son frecuentes en Apps Script y
 * se van solos al segundo intento. Lo que NO se insiste es más: si es una cuota agotada o una pantalla
 * de permisos, repetir no arregla nada y encima empuja contra la cuota. */
async function fetchResumen(label, url){
  let ultimo=null;
  for(let i=0;i<REINTENTOS;i++){
    if(i){
      const paginaGoogle = ultimo && ultimo.cuerpo!=null && !ultimo.cortada;
      const cont=document.getElementById('container');
      if(cont && !STATE.data) cont.innerHTML='<div class="loading">'
        + (paginaGoogle ? '⚠️ Google devolvió un error. Reintentando' : '📡 La señal se cortó. Reintentando')
        + ' (' + (i+1) + ' de ' + REINTENTOS + ')…</div>';
      await esperar(ESPERA_MS[i] || 2000);
    }
    try{ return await perfFetch(i ? label+' · reintento '+i : label, url); }
    catch(e){
      ultimo=e;
      // Fallo de red: hasta 3 intentos. Página de Google: 2. Rechazo del backend: ninguno (no mejora).
      if(esFalloDeRed(e)) continue;
      if(e && e.cuerpo!=null && i===0) continue;
      break;
    }
  }
  const err=new Error((ultimo && ultimo.message) || 'sin respuesta');
  err.tipo = esFalloDeRed(ultimo) ? 'red' : (ultimo && ultimo.cuerpo != null ? 'formato' : 'backend');
  err.cuerpo = ultimo && ultimo.cuerpo;
  throw err;
}
/* ============ D133 — CATÁLOGO DE CC: ni repetido ni en cada carga ============
 * Contrapartida en el cliente de los puntos 1 y 2 del backend. Todo se resuelve AQUÍ, nada más llegar
 * la respuesta, para que el resto de la pantalla siga leyendo `d.catCC` y `d.catCCUsados` como listas
 * de strings — no hay un solo sitio más que se entere del cambio.
 * ACEPTA LAS DOS FORMAS a propósito: la página se despliega sola al mezclar (GitHub Pages) y el Apps
 * Script se redespliega a mano, así que hay una ventana en la que uno está nuevo y el otro viejo. Con
 * esto, esa ventana da igual: si llegan strings se usan tal cual, si llegan índices se resuelven.
 * Si `localStorage` está lleno (esta pantalla también guarda ahí la plantilla .xlsx en base64), el
 * guardado falla en silencio, no se manda `ccv` y el servidor sigue mandando el catálogo entero: se
 * pierde la optimización, nunca la lista. */
const CC_CACHE_KEY='asis_catcc_v1', CC_FIRMA_KEY='asis_catcc_firma_v1';
function ccCacheLeer(){
  try{ const t=localStorage.getItem(CC_CACHE_KEY); const a=t?JSON.parse(t):null; return Array.isArray(a)&&a.length?a:null; }
  catch(e){ return null; }
}
// Solo se declara tener el catálogo si de verdad está guardado: si no, el servidor lo omitiría y la
// pantalla se quedaría sin buscador de CC.
function ccFirmaQueTengo(){
  try{ return ccCacheLeer() ? String(localStorage.getItem(CC_FIRMA_KEY)||'') : ''; }catch(e){ return ''; }
}
/* Estado del caché de CC, para el `console` de DEBUG_PERF. No es un adorno: si `localStorage` está
 * lleno (esta pantalla también guarda ahí la plantilla .xlsx en base64), el guardado falla, el catálogo
 * viaja ENTERO en cada carga y el ahorro no aparece nunca — sin este aviso, eso se vería como "la
 * optimización no sirvió" en vez de como "no cupo". */
let PERF_CC = '';
/* D133d — reconstruye una lista mandada como cabecera + filas de valores (`{cols, datos}`). El resto de
 * la pantalla sigue recibiendo objetos con sus nombres de campo: nadie más se entera.
 * TOLERA LAS DOS FORMAS: si llega un array (backend anterior) se devuelve tal cual, así que la página
 * nueva funciona con el Apps Script viejo mientras se despliega uno y otro.
 * LA GUARDA, que es el motivo de que esto sea aceptable: se compara `cols.length` contra CADA fila. Si
 * no cuadran, se LANZA. Sin ella, una fila corta daría campos vacíos y un `hora_salida` en blanco se
 * lee igual que "no lo reportaron" — un error que no se ve hasta que sale en el Parte de Navision.
 * Nulo y ausente vuelven a `''`, que es lo que había antes en esos campos. */
function expandirLista(v, nombre){
  if(Array.isArray(v)) return v;                    // forma antigua: objetos con sus claves
  if(!v || typeof v!=='object') return [];
  if(!Array.isArray(v.cols) || !Array.isArray(v.datos)) return [];
  const cols=v.cols, n=cols.length;
  return v.datos.map(function(fila, i){
    if(!Array.isArray(fila) || fila.length!==n){
      const e=new Error('La respuesta llegó mal formada en «'+nombre+'»: la fila '+(i+1)+' trae '
        + (Array.isArray(fila) ? fila.length : '?') + ' valores para ' + n + ' columnas. '
        + 'No se muestra nada, a propósito: con datos incompletos, una hora o un centro de costo en '
        + 'blanco se leerían como "no lo reportaron" y acabarían así en el Parte.');
      e.tipo='malformada'; throw e;
    }
    const o={};
    for(let j=0;j<n;j++){ const x=fila[j]; o[cols[j]] = (x===null || x===undefined) ? '' : x; }
    return o;
  });
}
function normalizarCatalogos(d){
  if(!d || typeof d!=='object') return d;
  d.filas     = expandirLista(d.filas, 'filas');            // D133d
  d.faltantes = expandirLista(d.faltantes, 'faltantes');
  if(Array.isArray(d.catCC) && d.catCC.length){
    try{
      localStorage.setItem(CC_CACHE_KEY, JSON.stringify(d.catCC));
      localStorage.setItem(CC_FIRMA_KEY, String(d.catCCv||''));
      PERF_CC='catCC llegó entero ('+d.catCC.length+') y quedó guardado: la próxima carga ya no lo trae';
    }catch(e){
      // No cupo: se borra lo que hubiera para no declarar una firma sin lista detrás.
      try{ localStorage.removeItem(CC_CACHE_KEY); localStorage.removeItem(CC_FIRMA_KEY); }catch(e2){}
      PERF_CC='⚠️ catCC NO se pudo guardar (localStorage lleno, ¿la plantilla .xlsx recordada?): '
             +'seguirá viajando entero en cada carga';
    }
  } else if(!Array.isArray(d.catCC)){
    d.catCC = ccCacheLeer() || [];      // no vino porque ya lo teníamos
    PERF_CC='catCC servido del caché del navegador ('+d.catCC.length+' ítems): no viajó por la red';
  }
  if(Array.isArray(d.catCCUsados)){
    d.catCCUsados = d.catCCUsados
      .map(v => (typeof v==='number' && typeof d.catCC[v]==='string') ? d.catCC[v] : v)
      .filter(v => typeof v==='string' && v);   // un índice que no resuelve se descarta, no ensucia la lista
  }
  return d;
}
async function cargarResumen(){
  const cont=document.getElementById('container');
  if(!STATE.data) cont.innerHTML='<div class="loading">⏳ Consultando…</div>';
  loadBar(true); perfReset();
  try{
    await sondaRed('sonda 1 (contenedor frío)');    // D132 — ver DEBUG_SONDA
    const data=await fetchResumen('asistencia (día)',
      `${APPS_SCRIPT_URL}?action=asistencia&fecha=${STATE.fecha}&usuario=${encodeURIComponent(STATE.usuario)}&area=${encodeURIComponent(STATE.areaFiltro||'')}`
      + `&ccv=${encodeURIComponent(ccFirmaQueTengo())}`);   // D133: "este catálogo de CC ya lo tengo"
    // OJO con `caducada`: `doGet` sella `auth:false` en TODO lo que devuelve `sesion_`, y ahí dentro va
    // también el caso "este script no tiene AUTH_SECRETO configurado" (D109: el secreto se copia A MANO
    // del Apps Script de obra al de asistencias, porque las Propiedades del Script son por proyecto).
    // Eso NO es una sesión caducada y mandar al usuario al login no lo arreglaría — daría vueltas para
    // siempre. Su propio mensaje ya dice qué ejecutar, así que se muestra tal cual.
    if(window.TM2Auth && TM2Auth.caducada(data) && !/AUTH_SECRETO/i.test(String(data.error||''))){
      const e=new Error(data.error||'Sesión no válida.'); e.tipo='sesion'; throw e;
    }
    if(!data.ok){ const e=new Error(data.error||'asistencia'); e.tipo='backend'; throw e; }
    STATE.data=normalizarCatalogos(data);   // D133: catCC del caché e índices resueltos, antes de pintar
    // D133: se sella QUÉ quedó pintado, para que la barra sepa si lo elegido ya está a la vista.
    STATE.fechaCargada=STATE.fecha; STATE.areaCargada=STATE.areaFiltro;
    render();
    renderBarra();
    precargarExportables();   // D133: la precarga del exportador, después de la consulta y no antes
    await sondaRed('sonda 2 (contenedor caliente)');   // después de pintar: no retrasa la pantalla
    perfTabla('carga del día '+STATE.fecha);
  }catch(err){
    // Con error se BORRA el contenido a propósito: dejar a la vista los números del día anterior con un
    // aviso encima sería peor (se leerían como los del día pedido).
    STATE.data=null; STATE.fechaCargada=''; STATE.areaCargada=null;
    document.getElementById('container').innerHTML='<div class="empty-state">'+mensajeDeFallo(err)+'</div>';
    renderBarra();   // D133: la barra sobrevive al error — se puede cambiar de día y reintentar
  }finally{
    loadBar(false);

// ¿La vista actual es de TIERRAS? (residente de tierras, jeisson, o admin sin filtrar ODT/ODL).
// Se usa para lo que es de tierras POR NATURALEZA: hoy, el indicador de extras del admin (D73), cuyos
// CC son de tierras. El flujo de dom/fest ya NO cuelga de aquí — ver `usaFlujoDomFest()` (D115).
// El caso del admin se escribe en POSITIVO (antes era "todo lo que no sea odt/odl"): con la lista
// negra, elegir "Ver como UF3" habría caído por descarte en el flujo de tierras.
// D119 — pasa de "la vista ES tierras" a "la vista INCLUYE tierras". El matiz importa por el Parte de
// Navision: si `angie` lo descarga en vista "Todas" y esta función diera falso, la fila de extras del
// admin (`buildAdminExtraRow`, D73) NO se inyectaría y el archivo saldría INCOMPLETO — y eso llega a
// Navision. Para los roles actuales el valor no cambia: `residente`/`asistencia_plus` siguen dando
// true siempre, y para el admin `!as.length || as.indexOf('tierras')>=0` da exactamente lo mismo que
// el `areaFiltro==='' || areaFiltro==='tierras'` de antes en las seis opciones de su selector.
function esVistaTierras(){
  if(STATE.rol==='residente' || STATE.rol==='asistencia_plus') return true;
  if(STATE.rol==='admin' || STATE.rol==='asistencia_plus_tm2'){

}
// D115: ¿esta vista usa el flujo CENTRALIZADO de dom/fest (D81c: se marca SOLO a quienes trabajaron
// desde "Completar faltantes"; a los demás no se les espera)? Tierras lo tiene desde D81. DRENAJES
// (ODT/ODL) se suma ahora: el permiso y el cálculo de horas ya eran idénticos —`guardarIndividual`
// autoriza a `duvan`/`residente_dren` y `clasificarHoras` decide por TIPO DE DÍA, nunca por área—, así
// que lo único que los separaba eran estas dos ayudas de pantalla: sin la guía de dom/fest y con el
// aviso de "gente sin reportar" al exportar, que en domingo marca a media obra como si faltara cuando
// lo normal es que no trabaje. Igualar la pantalla no cambia lo que se escribe ni lo que sale al Parte.
// D101 (P3, decisión del usuario jul-2026): UF3 sigue con la regla CONSERVADORA — el aviso de "gente
// sin reportar" se conserva TODOS los días, también dom/fest. Por eso `asistencia_plus_uf3` NO entra
// aquí. Si más adelante se confirma que va con la regla de tierras, es una línea.
// D119: `asistencia_plus_tm2` (angie) entra en la lista de roles, NO por la vista: sus tres áreas
// (tierras, ODT y ODL) usan ya el flujo centralizado tras D115, así que le da `true` mire lo que mire
// — también en "Todas", donde `esVistaTierras()` ya la habría cubierto, y en ODT/ODL, donde no.
function usaFlujoDomFest(){
  return esVistaTierras()
    || ['asistencia_plus_dren','residente_dren','residente_odt','residente_odl','asistencia_plus_tm2'].indexOf(STATE.rol)>=0
    || (STATE.rol==='admin' && filtroEsDrenajes());

// D115: ¿la vista es de DRENAJES? En dom/fest hay un riesgo que tierras no tiene: allá los capataces
// NO reportan ese día, pero en ODT/ODL sí reportan por cuadrilla todos los días, y el envío de cuadrilla
// PISA fecha+cuadrilla (D03/D107) — un reporte del capataz posterior borra lo que se marcó aquí por
// persona. De ahí el aviso extra en la guía; el orden seguro es que el resumen vaya de último.
// D119: a `angie` el aviso le aplica igual —reporta y completa faltantes en ODT/ODL, donde los capataces
// sí reportan por cuadrilla en dom/fest—, así que se le muestra siempre que su vista INCLUYA drenajes:
// en "Todas", en ODT y en ODL. Solo se le calla en la vista "Tierras", donde el riesgo no existe.
function esVistaDrenajes(){
  if(['asistencia_plus_dren','residente_dren','residente_odt','residente_odl'].indexOf(STATE.rol)>=0) return true;
  if(STATE.rol==='admin') return filtroEsDrenajes();
  if(STATE.rol==='asistencia_plus_tm2'){

/* D116 — el "Ver como" del admin admite VARIAS áreas separadas por coma (`odt,odl` = drenajes completo,
 * la misma vista que tiene `residente_dren` por su rol, D84). Estos tres helpers son todo lo que hacía
 * falta: antes se comparaba el filtro con `==='odt'`, que con el valor combinado daba falso y dejaba a
 * la vista de drenajes sin su flujo de dom/fest (D115) ni su aviso del pisado por cuadrilla. */
function areasFiltro(){
  return String(STATE.areaFiltro||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);

function filtroEsDrenajes(){
  const as=areasFiltro();
  return as.length>0 && as.every(function(a){ return a==='odt' || a==='odl'; });
}
/* D119 — quién ve el selector "Ver como" y con qué opciones. Devuelve `null` = no se dibuja.

 * `esVistaDrenajes()` y `usaFlujoDomFest()` ya lo daban por bueno (`areasFiltro()` parte por comas). */
function opcionesVerComo(){
  if(STATE.rol==='admin')               return ['','tierras','odt','odl','odt,odl','uf3'];

// D101: ¿la vista está acotada a un área? Con `areas` del backend (o, si el Apps Script aún no se

/* D106 — misma barrera que en asistencia.html. Aquí importa igual o más: desde esta pantalla se
 * ESCRIBE con `asistencia_individual` (detalle por cuadrilla y "Completar faltantes"), así que una
 * fecha vacía en STATE guardaba filas sin fecha en ASISTENCIA. Y era un círculo: con la fecha vacía
 * el backend devolvía justo las filas huérfanas, que se veían como si fueran el día pedido. */
function fechaValida(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))) return false;
  const p=String(v).split('-'), dt=new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  return dt.getFullYear()===Number(p[0]) && dt.getMonth()===Number(p[1])-1 && dt.getDate()===Number(p[2]);
}

/* D117 — clave de PERSONA: código si lo tiene, si no la cédula. Misma regla que `guardarIndividual.keyOf`
 * y que los faltantes del backend, así que lo que aquí se cuenta como una persona es lo mismo que allá.
 * El prefijo evita que un código que casualmente valga "12345" choque con la cédula 12345. */
function clavePersona(f){
  const c=String((f&&f.codigo)||'').trim();
  return c ? ('COD:'+c) : ('CED:'+String((f&&f.cedula)||'').trim());
}
// D118: primera aparición de cada persona en una lista (misma clave que `clavePersona`). Se usa para
// que todos los KPI cuenten gente y no filas, vengan de ASISTENCIA o del roster.
function unicasPorPersona(lista){
  const vistos={}, out=[];
  (lista||[]).forEach(function(f){ const k=clavePersona(f); if(!vistos[k]){ vistos[k]=true; out.push(f); } });
  return out;
}
/* D119 — agrupa las filas del día por PERSONA uniendo las que comparten CUALQUIER identificador.
 * `clavePersona` sola no basta aquí: el duplicado que genera una edición mal emparejada deja justamente
 * dos filas con identificadores DISTINTOS (p. ej. la del capataz sin código y la de la edición con él),
 * así que agrupando por una clave única se veían como dos personas y el aviso no las delataba — que es
 * como estos duplicados llegaron hasta el Parte. Se agrupa por código, por cédula, o —si no hay ninguno—
 * por nombre+cuadrilla, igual que el emparejamiento del backend. */
function normCod(v){ return String(v==null?'':v).trim().replace(/^0+/, ''); }
/* D123 — corrige el agrupamiento de D119, que unía por «código O cédula». En la obra hay DOS PERSONAS
 * DISTINTAS con la misma cédula (74270 FREDY MACHACON y 76358 ALEIXER LIZARAZO comparten la 91515627:
 * error de digitación en PERSONAL), y ese criterio las fusionaba en una sola, marcándolas como
 * duplicado cuando el Excel —correctamente— las lleva como dos. Ahora manda el CÓDIGO, que es el
 * identificador de Navision y el que las distingue; la cédula solo decide cuando falta el código.
 * Una cédula que aparece con DOS códigos distintos ya no arrastra a nadie: `cedulaDeCodigo` solo la
 * usa de puente si esa cédula lleva a un único código. */
function cedulaACodigo(filas){
  const m={};
  (filas||[]).forEach(function(f){
    const c=normCod(f.codigo), d=String(f.cedula||'').trim();
    if(!c || !d) return;
    (m[d]=m[d]||[]).indexOf(c)<0 && m[d].push(c);
  });
  return m;
}
function agruparPorPersona(filas){
  const puente=cedulaACodigo(filas), grupos={}, orden=[];
  (filas||[]).forEach(function(f){
    const c=normCod(f.codigo), d=String(f.cedula||'').trim();
    let k;
    if(c) k='COD:'+c;                                        // el código manda siempre
    else if(d && puente[d] && puente[d].length===1) k='COD:'+puente[d][0];   // sin código: hereda el único que lleva esa cédula
    else if(d) k='CED:'+d;                                   // cédula ambigua o sin pareja: va sola
    else k='NOM:'+String(f.nombre||'').trim().toLowerCase()+'|'+String(f.cuadrilla||'').trim().toLowerCase();
    if(!grupos[k]){ grupos[k]=[]; orden.push(k); }
    grupos[k].push(f);
  });
  return orden.map(function(k){ return grupos[k]; });
}
/* D123 — una cédula compartida por códigos distintos NO es un duplicado, pero sí es un error de datos
 * que hay que corregir: son dos personas y una tiene la cédula de la otra en PERSONAL. Se avisa aparte,
 * porque el arreglo es distinto (corregir la cédula, no unificar filas) y porque en Navision esas dos
 * personas también van a chocar. */
function cedulasCompartidas(filas){
  const m=cedulaACodigo(filas), out=[];
  Object.keys(m).forEach(function(d){
    if(m[d].length>1){
      const quienes={};
      (filas||[]).forEach(function(f){
        if(String(f.cedula||'').trim()===d && normCod(f.codigo)) quienes[normCod(f.codigo)]=f;
      });
      out.push({ cedula:d, personas:Object.keys(quienes).map(function(c){ return quienes[c]; }) });
    }
  });
  return out;
}
/* D117/D118 — aviso de personas con MÁS DE UNA fila el mismo día. No es un detalle de presentación: el
 * Parte de Navision se arma con una línea por FILA (`generarExcel`), así que una persona duplicada se va
 * al archivo dos veces y cobra doble.
 *
 * D118 — hay DOS causas distintas y el aviso las separa, porque se arreglan en sitios distintos:
 *  (a) filas en cuadrillas DISTINTAS: dos cuadrillas reportaron a la misma persona. El envío pisa
 *      fecha+CUADRILLA (D03/D107), nunca fecha+persona, así que las dos sobreviven. Se arregla dejándola
 *      en UNA cuadrilla (gestión de personal → mover) y reenviando.
 *  (b) filas en la MISMA cuadrilla, mismo reportante — el caso encontrado en ODT el 01-ago-2026: eso NO
 *      lo puede producir un doble envío (el segundo borra el primero). Solo pasa si la persona está DOS
 *      VECES en la hoja PERSONAL: `roster` no deduplicaba, así que el formulario se la mostraba dos veces
 *      al responsable y un solo envío escribía dos filas (por eso se ven marcas contradictorias: al
 *      segundo renglón lo llenaron distinto). Se arregla borrando la fila sobrante en PERSONAL. */
function duplicadasHtml(dups){
  if(!dups.length) return '';
  const mismaCuad=dups.filter(function(fs){ return unicos(fs.map(function(f){ return f.cuadrilla||''; })).length===1; });
  let h='<div class="aviso" style="margin-top:10px;"><b>⚠️ '+dups.length+' persona(s) con más de un reporte hoy.</b> '
    + 'Sus horas saldrían <b>repetidas en el Parte de Navision</b> (el archivo lleva una línea por fila reportada).';
  if(mismaCuad.length){
    h+='<div style="margin-top:6px;">🔎 <b>'+mismaCuad.length+' está(n) repetida(s) DENTRO de la misma cuadrilla.</b> '
      + 'Eso no lo causa un doble envío (el segundo pisa al primero): significa que la persona está <b>dos veces en la hoja PERSONAL</b>, '
      + 'así que el formulario se la mostró dos veces al responsable. <b>Corrígelo borrando la fila sobrante en PERSONAL</b> '
      + '(o marcándola <i>inactivo</i>) y pidiendo que esa cuadrilla vuelva a enviar el día.</div>';
  }
  if(mismaCuad.length<dups.length){
    h+='<div style="margin-top:6px;">🔎 El resto está reportado por <b>dos cuadrillas distintas</b>: el envío pisa <i>fecha+cuadrilla</i>, '
      + 'no <i>fecha+persona</i>, así que las dos filas quedan vivas. Déjala en una sola cuadrilla '
      + '(abajo, en <b>Gestión de personal → mover</b>) y pide que esa cuadrilla vuelva a enviar.</div>';
  }
  h+='<div style="margin-top:8px;">';
  dups.forEach(function(filas){
    const f0=filas[0];
    // Si las filas se contradicen (presente en una, ausente en otra) la persona cae en DOS KPI a la vez:
    // por eso "Total personas" cuenta gente distinta y no la suma de los tres.
    const contradice = filas.some(function(f){ return f.presente==='No'; }) && filas.some(function(f){ return f.presente!=='No'; });
    const unaCuad = unicos(filas.map(function(f){ return f.cuadrilla||''; })).length===1;
    // D121: se muestra el PROYECTO (y el CC) de cada fila. Sin eso, el caso más engañoso era invisible:
    // con las dos filas en proyectos distintos la persona sale UNA vez en cada Excel, así que al abrir un
    // archivo no se ve nada raro y el aviso parecía equivocado. Con el proyecto delante se entiende sola.
    const proysDup=unicos(filas.map(function(f){ return String(f.proyecto||'').trim(); }).filter(Boolean));
    const detalle=filas.map(function(f){
      const est = f.presente==='No' ? 'ausente' : (String(f.cc||'').trim() ? 'presente' : 'presente sin CC');
      const proy=String(f.proyecto||'').trim();
      // D122: el número de FILA en la hoja ASISTENCIA. Es lo único que zanja un "en el Sheet solo sale
      // una vez": buscar por código falla si una de las filas lo tiene vacío o guardado como número, y
      // un filtro por fecha en texto no ve las filas cuya celda es Date. Con el número se va directo
      // (en Sheets: cuadro de nombre → A<fila> → Enter).
      return (f._row?'<b>fila '+esc(f._row)+'</b> · ':'')
        + esc(f.cuadrilla||'(sin cuadrilla)')+' → '+est+(f.reporta?' ('+esc(f.reporta)+')':'')
        + (proy?' · proy. <b>'+esc(proy)+'</b>':'')
        + ' · cód. <b>'+esc(String(f.codigo||'').trim()||'(vacío)')+'</b>'
        + ' · céd. <b>'+esc(String(f.cedula||'').trim()||'(vacío)')+'</b>'
        + (String(f.cc||'').trim()?'<br><small style="opacity:.8">'+esc(f.cc)+'</small>':'');
    }).join('<br>')
      + (unaCuad ? '<br>— <b>misma cuadrilla</b>: revisa PERSONAL' : '')
      + (contradice ? '<br>— <b>se contradicen</b>: cuenta como presente Y como ausente' : '')
      + (proysDup.length>1 ? '<br>— ⚠️ <b>proyectos distintos ('+esc(proysDup.join(' y '))+')</b>: sale UNA vez en CADA Excel, '
          + 'por eso abriendo un solo archivo no se nota. Entre los dos Partes se le pagan las horas dos veces.' : '');
    h+='<div style="padding:4px 0;"><b>'+esc(f0.nombre||'(sin nombre)')+'</b> '
      + '<small style="color:var(--muted)">'+esc(f0.codigo||f0.cedula||'')+'</small><br>'
      + '<small style="color:var(--muted)">'+detalle+'</small></div>';
  });
  return h+'</div></div>';
}
function unicos(arr){ return (arr||[]).filter(function(v,i,a){ return a.indexOf(v)===i; }); }
/* D125 — candado anti DOBLE TOQUE. El envío tarda unos segundos y el botón no daba señal de estar
 * trabajando, así que se volvía a pulsar: dos peticiones idénticas en vuelo a la vez, cada una leyendo
 * la hoja antes de que la otra borrara, y la persona terminaba repetida en filas consecutivas. El
 * cerrojo del backend (LockService) ya impide la corrupción; esto evita además la petición de más y
 * le dice al usuario que sí está pasando algo. */
function bloquearBoton(id, texto){
  const b=document.getElementById(id); if(!b) return null;
  if(b.disabled) return null;                      // ya hay un envío en vuelo: no se manda otro
  b.dataset.txt=b.textContent; b.disabled=true; b.style.opacity='.6'; b.textContent=texto||'Guardando…';
  return b;
}
function liberarBoton(b){
  if(!b) return;
  b.disabled=false; b.style.opacity=''; if(b.dataset.txt) b.textContent=b.dataset.txt;
}
// D123 — aviso de cédulas repetidas entre personas DISTINTAS. No es un duplicado (cada una lleva su
// propia fila al Parte, y eso está bien): es un error de digitación en PERSONAL que hay que corregir.
function cedulasCompartidasHtml(lista){
  if(!lista.length) return '';
  let h='<div class="aviso" style="margin-top:10px;"><b>🪪 '+lista.length+' cédula(s) repetida(s) en personas distintas.</b> '
    + '<b>No es un duplicado</b> —cada una es una persona real y va con su propia fila al Parte, correctamente— '
    + 'pero una de las dos tiene la cédula de la otra en la hoja <b>PERSONAL</b>. Conviene corregirlo: en Navision esas dos '
    + 'personas también chocan, y cualquier búsqueda por cédula devuelve a quien no es.<div style="margin-top:8px;">';
  lista.forEach(function(g){
    h+='<div style="padding:4px 0;">céd. <b>'+esc(g.cedula)+'</b> → '
      + g.personas.map(function(f){ return esc(f.nombre||'(sin nombre)')+' <small style="color:var(--muted)">(cód. '+esc(f.codigo)+' · '+esc(f.cuadrilla||'')+')</small>'; }).join(' &nbsp;·&nbsp; ')
      + '</div>';
  });
  return h+'</div></div>';
}

function render(){
  const _t0=ahora();
  // render() reconstruye el contenedor: los bloques diferidos pendientes del render anterior ya no
  // existen en el DOM, así que se descartan (si no, quedarían apuntando a ids muertos).
  Object.keys(LAZY).forEach(k=>delete LAZY[k]);
  const d=STATE.data;
  const filas=d.filas||[], cuadrillas=d.cuadrillas||[], faltantes=d.faltantes||[];
  // Presente cuenta SOLO si tiene CC. Presente sin CC = no reportado (ya viene en faltantes).
  const presentesFilas=filas.filter(f=>f.presente==='Si' && String(f.cc||'').trim());
  // D118: los faltantes también se deduplican por persona. Salen de recorrer `personalActivo`, así que
  // una persona con DOS filas en la hoja PERSONAL (la causa raíz, ver `duplicadasHtml`) aparecía dos
  // veces en la lista y el KPI la contaba doble, igual que le pasaba a "Presentes" antes de D117.
  const ausentesConMotivo=unicasPorPersona(faltantes.filter(f=>f.tipo==='ausente'));
  const sinReportar=unicasPorPersona(faltantes.filter(f=>f.tipo==='sin_reportar'));
  /* D117 — "Presentes" cuenta PERSONAS, no filas. Este KPI contaba filas de ASISTENCIA mientras que
   * "Ausentes"/"Sin reportar" cuentan personas del roster, así que los tres no eran sumables: en ODT+ODL
   * del 03-ago-2026 daban 82+6+0 = 88 sobre una población de 82. La causa es que una persona puede tener
   * MÁS DE UNA fila el mismo día — el envío de cuadrilla pisa fecha+cuadrilla (D03/D107), no fecha+persona,
   * así que la misma persona reportada en DOS cuadrillas (típico al poblar la cuadrilla DUVAN de D105 sin
   * MOVER a la gente en PERSONAL, o el caso 76775 de MAURICIO/ODL ya advertido en D72) deja dos filas
   * vivas. Agrupar por persona hace que los tres KPI vuelvan a sumar.
   * D119: se agrupa uniendo identificadores COMPARTIDOS (`agruparPorPersona`), no por una clave única —
   * el duplicado que dejaba una edición mal emparejada tiene los identificadores distintos en cada fila
   * (una con código y otra sin él), así que con clave única pasaban por dos personas y no se detectaban. */
  const presentes=agruparPorPersona(presentesFilas).map(g=>g[0]);   // una fila por PERSONA presente
  // Personas con más de una fila ese día: el síntoma que descuadraba los KPI y —lo importante— lo que
  // duplicaría sus horas en el Parte de Navision, que se arma con UNA línea por fila (ver generarExcel).
  const duplicadas=agruparPorPersona(filas).filter(g=>g.length>1);
  const porProyecto={};
  presentes.forEach(f=>{ const p=f.proyecto||'(sin proyecto)'; porProyecto[p]=(porProyecto[p]||0)+1; });

  // D133: la card de fecha / "ver como" ya no se pinta aquí — vive en la barra de consulta, fuera del
  // contenedor, para poder elegir el día ANTES de que haya nada cargado. Ver `renderBarra`.
  let html='';
  html+='<div class="section-title">Totales del día '+esc(STATE.fechaCargada||STATE.fecha)+'</div>';
  /* D117 — el cuarto tile responde la duda del dueño (ago-2026): "¿los presentes ya incluyen a los
   * ausentes?". No: son excluyentes. Pero el total NO se calcula sumando los tres, sino contando
   * PERSONAS DISTINTAS entre los tres grupos, porque la suma falla en un caso real: si a alguien lo
   * reportan presente en una cuadrilla y ausente en otra (dos filas vivas, el envío pisa fecha+cuadrilla),
   * está en los dos KPI a la vez y sumar lo contaría dos veces. Con gente distinta el total es la
   * población del día en cualquier escenario, y la discrepancia contra la suma queda explicada por el
   * aviso de duplicadas de aquí abajo. */
  const idsDia={};
  presentes.forEach(f=>{ idsDia[clavePersona(f)]=true; });
  ausentesConMotivo.forEach(f=>{ idsDia[clavePersona(f)]=true; });
  sinReportar.forEach(f=>{ idsDia[clavePersona(f)]=true; });
  const totalDia=Object.keys(idsDia).length;
  html+='<div class="kpis">'
    + `<div class="kpi"><div class="k-val">${presentes.length}</div><div class="k-lbl">Presentes</div></div>`
    + `<div class="kpi"><div class="k-val">${ausentesConMotivo.length}</div><div class="k-lbl">Ausentes (con motivo)</div></div>`
    + `<div class="kpi"><div class="k-val">${sinReportar.length}</div><div class="k-lbl">Sin reportar</div></div>`
    + `<div class="kpi"><div class="k-val">${totalDia}</div><div class="k-lbl">Total personas</div></div>`
    + '</div>';
  html+='<div class="card">'+Object.keys(porProyecto).sort().map(p=>`<div class="cuad-row"><span>Proyecto ${esc(p)}</span><b>${porProyecto[p]}</b></div>`).join('')+'</div>';
  html+=duplicadasHtml(duplicadas);
  html+=cedulasCompartidasHtml(cedulasCompartidas(filas));   // D123

  // Indicador de extras del admin (D73): solo lectura, para el residente de tierras/jeisson/admin (las
  // extras son CC de tierras). D74b: se oculta si el admin está viendo ODT/ODL (no aplican allá).
  const viendoTierras = esVistaTierras();
  if(viendoTierras){
    const exAdmin=d.extrasAdmin||[];
    if(exAdmin.length){
      const detalle=exAdmin.map(e=>`${e.horas}h ${esc(e.tipo)} · ${esc(e.cc)} (proy. ${esc(e.proyecto)})`).join(' · ');
      html+=`<div class="cuad-row" style="border:1px solid rgba(46,204,113,0.3);border-radius:10px;padding:10px 12px;margin-top:4px;"><span>⏱️ Extras admin</span><span class="ok">registradas ✓ — ${detalle}</span></div>`;
    } else {
      html+='<div class="cuad-row" style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:4px;"><span>⏱️ Extras admin</span><span style="color:var(--muted)">sin registrar</span></div>';
    }
  }

  // D78: catálogo para el buscador de CC (detalle por cuadrilla + completar faltantes): los CC
  // frecuentes del área revisada (CC_USADOS) van primero y debajo TODO el catálogo (CAT_CC completo),
  // para poder registrar un CC especial. Reemplaza el <datalist> (no mostraba el listado completo de
  // forma confiable) por un buscador desplegable real.
  STATE._ccUsados=(d.catCCUsados||[]);
  // D101: el "resto" (CAT_CC) es el catálogo GLOBAL y hoy solo tiene CC de tierras. Cuando la vista está
  // acotada a un área (residente de UF3/drenajes, o el admin con "Ver como"), se filtra a los proyectos
  // de esa área para no ofrecerle CC de otro frente; si no se sabe cuáles son, no se ofrece ninguno.
  const proysArea=proyectosDelArea();
  const acotada=vistaAcotada(d);
  STATE._ccResto=(d.catCC||[])
    .filter(cc=>STATE._ccUsados.indexOf(cc)<0)
    .filter(cc=>!acotada || proysArea.indexOf(proyectoDeCC(cc))>=0);
  STATE._detalle={}; STATE._detIdx=0;
  // Una sola pasada por `filas` para agrupar por cuadrilla (antes era un filter por cuadrilla = N×M).
  const porCuadrilla={}; filas.forEach(f=>{ (porCuadrilla[f.cuadrilla]=porCuadrilla[f.cuadrilla]||[]).push(f); });
  STATE._porCuadrilla=porCuadrilla;
  html+='<div class="pc-zona"><div class="pc-izq">';   // D151: columna izquierda — el día
  html+='<div class="section-title">Cuadrillas</div><div class="card">';
  cuadrillas.forEach((c,ci)=>{
    const detId='detCuad'+ci;
    const filasCuad=porCuadrilla[c.cuadrilla]||[];
    const tieneDet=filasCuad.length>0;
    html+=`<div class="cuad-row" ${tieneDet?`style="cursor:pointer;" onclick="toggleCuad('${detId}',this)"`:''}>`
      + `<span>${esc(c.cuadrilla)} <small style="color:var(--muted)">(${esc(c.responsables)})</small></span>`
      + '<span style="display:flex;gap:10px;align-items:center;">'
      + (c.reporto ? `<span class="ok">✓ Reportó — ${esc(c.reporta)}</span>` : `<span class="no">✗ No ha reportado</span>`)
      + (tieneDet ? `<button class="mini-btn detToggle" onclick="event.stopPropagation();toggleCuad('${detId}',this.closest('.cuad-row'))">Ver detalle</button>` : '')
      + '</span></div>';
    // D76 diferido: el contenedor va vacío y el detalle (clasificación de horas + editor por persona)
    // se arma al desplegar esa cuadrilla, no para todas por adelantado. Resultado visible idéntico.
    if(tieneDet){
      html+=`<div id="${detId}" style="display:none;"></div>`;
      LAZY[detId]=(function(cc, ff){ return function(){ return detalleCuadrillaHtml(cc, ff); }; })(c, filasCuad);
    }
  });
  html+='</div>';

  // D74: notas del día que dejaron los capataces (novedades, alguien nuevo, anomalías).
  const notas=d.notas||[];
  if(notas.length){
    html+='<div class="section-title">📝 Notas del día</div><div class="card">';
    notas.forEach(n=>{
      html+=`<div class="cuad-row" style="align-items:flex-start;"><span style="flex:1;"><b style="color:var(--accent-txt)">${esc(n.cuadrilla)}</b> <small style="color:var(--muted)">(${esc(n.reporta)})</small><br>${esc(n.nota)}</span></div>`;
    });
    html+='</div>';
  }

  html+='<div class="section-title">Personas faltantes</div><div class="card">';
  // D115: en dom/fest, con el flujo centralizado (tierras y drenajes), "sin reportar" NO es un olvido —
  // ese día trabaja solo el personal disponible y a los demás no se les espera. El número se conserva
  // (sirve para buscar a alguien en "Completar faltantes"), pero se dice qué significa: sin esta línea
  // el domingo parecía media obra faltando. No cambia ningún dato ni lo que sale al Parte.
  const domFestFlujo = tipoJornadaDeFecha(STATE.fecha, d.festivos||[])==='domfest' && usaFlujoDomFest();
  if(domFestFlujo && sinReportar.length){
    html+='<div class="aviso" style="margin:0 0 10px;">📅 <b>Domingo/festivo:</b> los '+sinReportar.length+' "sin reportar" <b>no son faltantes</b> — ese día solo se sube a quienes trabajaron. No cuentan como ausentes ni salen al Parte.</div>';
  }
  if(!faltantes.length){ html+='<p style="color:var(--muted);font-size:13px;">No hay faltantes: todas las cuadrillas reportaron y no hay ausentes.</p>'; }
  if(sinReportar.length){
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
      +'<p style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;">Sin reportar ('+sinReportar.length+')</p>'
      +'<button class="mini-btn" onclick="toggleLista(\'listaSinRep\',this)">Mostrar</button></div>';
    // Diferido: la lista nace oculta, así que su HTML se arma al pulsar "Mostrar".
    html+='<div id="listaSinRep" style="display:none;"></div>';
    LAZY['listaSinRep']=function(){
      return sinReportar.map(f=>{
        const badge = f.incompleto ? '<span class="badge sin">Presente sin CC</span>' : '<span class="badge sin">Sin reportar</span>';
        return `<div class="falt-row"><div class="nm"><b>${esc(f.nombre)}</b><small>${esc(f.cargo)} · ${esc(f.cuadrilla)} · resp. ${esc(f.responsable)}</small></div>${badge}</div>`;
      }).join('');
    };
  }
  if(ausentesConMotivo.length){
    html+='<p style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px;">Reportado ausente (con motivo)</p>';
    ausentesConMotivo.forEach(f=>{
      html+=`<div class="falt-row"><div class="nm"><b>${esc(f.nombre)}</b><small>${esc(f.cargo)} · ${esc(f.cuadrilla)} · resp. ${esc(f.responsable)}</small></div><span class="badge aus">${esc(f.motivo)}</span></div>`;
    });
  }
  html+='</div>';

  html+=seccionCompletar(d);

  html+='</div><div class="pc-pie">';   // D151: el seguimiento de ausencias va a ancho completo:
  html+=seccionAusencias();              // su tabla no cabe en una columna estrecha.
  html+='</div><div class="pc-der">';   // D151: columna derecha — herramientas y administración
  html+='<div class="section-title">Descargar Excel Navision</div>';
  html+=exportCardHtml();

  // D72/D74b: gestión de personal para residente(tierras), admin, jeisson y residentes de área; el backend
  // la limita a su área (jeisson = tierras, mismos permisos que el residente de tierras).
  // D88: duvan (asistencia_plus_dren) igual pero acotado por el backend a ODT+ODL.
  if(['residente','admin','asistencia_plus','asistencia_plus_dren','asistencia_plus_uf3','asistencia_plus_tm2','residente_odt','residente_odl','residente_dren'].indexOf(STATE.rol)>=0){
  html+='</div><div class="pc-gestion">';   // D155: la tabla de personal tiene cinco columnas
                                            // y no cabe en la columna estrecha: fila entera.
  if(true){
    html+='<div class="section-title">Gestión de personal</div>';
    html+='<div class="card" id="gestionCard"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'
      + '<button class="btn-ghost" onclick="cargarPersonal()">Cargar personal ↻</button>'
      // D99 (Fase 2 punto 5): el backend cachea 6 h los catálogos casi estáticos (CAT_CC, CAT_MOTIVOS,
      // CC_USADOS, CONFIG, TURNOS, CUADRILLAS…). Lo que se edita A MANO en el Sheet no pasa por el
      // script, así que este botón fuerza la relectura sin esperar el TTL ni redesplegar.
      + '<button class="btn-ghost" onclick="refrescarCatalogos(this)" title="Úsalo si acabas de editar CAT_CC, motivos, CONFIG o cuadrillas directamente en el Sheet">↻ Refrescar catálogos</button>'
      + '<span id="cacheMsg" style="font-size:12px;color:var(--muted);"></span>'
      + '</div><div id="gestionBody" style="margin-top:12px;"></div></div>';
  }
  }

  html+='</div></div>';   // D155: cierra pc-gestion y pc-zona
  document.getElementById('container').innerHTML=html;
  if(STATE.personal) renderPersonal();
  renderAusFiltros(); renderAusResultados();   // D94: repinta lo ya consultado tras un re-render
  perfMarca('pintado (render)', ahora()-_t0);
}

/* ================= BUSCADOR DE CC (D78) =================
 * Quien accede al resumen puede escoger CUALQUIER centro de costo del catálogo completo (CAT_CC),
 * no solo los frecuentes: el desplegable muestra primero los "Frecuentes" del área revisada
 * (CC_USADOS) y debajo el "Catálogo completo", filtrable por código o nombre. Lo usan el detalle
 * por cuadrilla (detEditorHtml) y "Completar faltantes". El input conserva el id que leen
 * guardarDetalle/guardarCompletar. onmousedown (no onclick) para ganarle al blur del input. */
const CC_PICK_CAP=80;   // tope de opciones visibles a la vez; el resto aparece al filtrar
function ccPickerHtml(id, value){
  return `<div class="cc-search"><input type="text" id="${id}" value="${esc(value||'')}" placeholder="Buscar CC por código o nombre…" autocomplete="off" oninput="ccPickFilter('${id}')" onfocus="ccPickFilter('${id}')" onblur="ccPickBlur('${id}')"><div class="cc-results" id="${id}-res" style="display:none;"></div></div>`;
}
function ccPickFilter(id){
  const inp=document.getElementById(id), box=document.getElementById(id+'-res');
  if(!inp||!box) return;
  const q=(inp.value||'').trim().toLowerCase();
  const match=cc=>!q || cc.toLowerCase().indexOf(q)>=0;
  const us=(STATE._ccUsados||[]).filter(match);
  const re=(STATE._ccResto||[]).filter(match);
  const pool=us.concat(re.slice(0, Math.max(0, CC_PICK_CAP-us.length)));
  STATE._ccPickList=pool;
  let h='', i=0;
  if(!pool.length){ h='<div class="cc-opt" style="cursor:default;color:var(--muted)">Sin resultados</div>'; }
  else {
    if(us.length) h+='<div class="cc-head">Frecuentes</div>';
    us.forEach(cc=>{ h+=`<div class="cc-opt" onmousedown="ccPickChoose('${id}',${i++})">${esc(cc)}</div>`; });
    const nResto=pool.length-us.length;
    if(nResto>0) h+='<div class="cc-head">Catálogo completo</div>';
    for(let k=0;k<nResto;k++){ h+=`<div class="cc-opt" onmousedown="ccPickChoose('${id}',${i++})">${esc(pool[us.length+k])}</div>`; }
    const faltan=(us.length+re.length)-pool.length;
    if(faltan>0) h+=`<div class="cc-opt" style="cursor:default;color:var(--muted)">…y ${faltan} más · escribe para filtrar</div>`;
  }
  box.innerHTML=h; box.style.display='block';
}
function ccPickChoose(id, i){
  const inp=document.getElementById(id); if(inp) inp.value=(STATE._ccPickList||[])[i]||'';
  const box=document.getElementById(id+'-res'); if(box) box.style.display='none';
}
function ccPickBlur(id){ setTimeout(function(){ const b=document.getElementById(id+'-res'); if(b) b.style.display='none'; }, 200); }

/* ================= DETALLE POR CUADRILLA (D76) =================
 * Despliega, dentro del listado de "Cuadrillas", CÓMO reportó cada persona: presente/ausente, turno,
 * entrada–salida, CC y el desglose ordinarias/extras EXACTO del Parte (mismo clasificarHoras que el
 * export). Así la residente revisa de un vistazo quién lleva horas extra o de más/de menos, sin abrir
 * el Excel. Cada persona se puede EDITAR en el sitio (reusa asistencia_individual, no pisa la cuadrilla).
 * Estándar para todas las áreas (tierras/ODT/ODL): usa los mismos `filas` del resumen. */
function toggleCuad(id, rowEl){
  const el=document.getElementById(id); if(!el) return;
  const show = el.style.display==='none';
  // Render progresivo (D76): el detalle de ESTA cuadrilla se arma la primera vez que se despliega.
  if(show && LAZY[id]){ const t0=ahora(); el.innerHTML=LAZY[id](); delete LAZY[id]; perfMarca('detalle '+id, ahora()-t0); }
  el.style.display = show ? 'block' : 'none';
  const b=rowEl.querySelector('.detToggle'); if(b) b.textContent = show ? 'Ocultar' : 'Ver detalle';
}
// D81: turnos elegibles según la fecha del resumen — en sábado solo los que tienen variante sabatina
// (un turno que "acaba el viernes" no se ofrece el sábado); en domingo/festivo NINGUNO ('' oculta el
// selector: la jornada Dom/Fest es única, 07:00–15:00 editable).
function turnoOptsHtml(turnos, sel){
  const tipoJ=tipoJornadaDeFecha(STATE.fecha, (STATE.data&&STATE.data.festivos)||[]);
  if(tipoJ==='domfest') return '';
  const unq=[]; (turnos||[]).forEach(t=>{ const tn=String(t.turno);
    if(unq.indexOf(tn)>=0) return;
    if(tipoJ==='sabado' && !(turnos||[]).some(x=>String(x.turno)===tn && x.tipo_dia==='sabado')) return;
    unq.push(tn); }); unq.sort();

function detalleCuadrillaHtml(c, filasCuad){

  return `<div class="card" style="background:var(--surface2);margin-bottom:8px;">${resumen}${filasHtml}</div>`;

async function guardarDetalle(idx){
  const f=STATE._detalle[idx]; if(!f) return;
  const est=document.getElementById('det-est-'+idx).value;
  let fila;
  if(est==='Si'){
    const cc=document.getElementById('det-cc-'+idx).value.trim();
    if(!cc){ alert('Falta el Centro de Costo.'); return; }
    const tur=document.getElementById('det-tur-'+idx);
    fila={ codigo:f.codigo, cedula:f.cedula, nombre:f.nombre, cargo:f.cargo, cuadrilla:f.cuadrilla,
      cc, proyecto:proyectoFromCC(cc), hora_entrada:document.getElementById('det-ent-'+idx).value,
      hora_salida:document.getElementById('det-sal-'+idx).value, presente:'Si', motivo_ausencia:'', turno:tur?tur.value:'1' };
  } else {
    const mot=document.getElementById('det-mot-'+idx).value;
    if(!mot){ alert('Falta el motivo de ausencia.'); return; }
    fila={ codigo:f.codigo, cedula:f.cedula, nombre:f.nombre, cargo:f.cargo, cuadrilla:f.cuadrilla,
      cc:'', proyecto:'', hora_entrada:'', hora_salida:'', presente:'No', motivo_ausencia:mot, turno:'' };
  }
  // D106: no se escribe una fila sin fecha (el backend también lo rechaza; aquí se avisa mejor).
  if(!fechaValida(STATE.fecha)){ alert('⚠️ No se puede guardar sin fecha. Elige el día en el campo "Fecha".'); return; }
  const msg=document.getElementById('det-msg-'+idx); msg.innerHTML='<div class="aviso">⏳ Guardando…</div>';
  const btn=bloquearBoton('det-save-'+idx);   // D125: sin esto, el segundo toque manda otra petición
  if(!btn && document.getElementById('det-save-'+idx)) return;   // ya había un envío en vuelo
  try{
    perfReset();
    const data=await perfFetch('asistencia_individual (detalle)', APPS_SCRIPT_URL, { method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'asistencia_individual', fecha:STATE.fecha, reporta:STATE.usuario, usuario:STATE.usuario, filas:[fila] }) });
    perfTabla('guardar detalle');
    if(data.ok){ STATE.exportCache={}; cargarResumen(); }   // re-render: el botón se rehace solo
    else { liberarBoton(btn); msg.innerHTML='<div class="aviso">⚠️ '+esc(data.error||'error')+'</div>'; }
  }catch(err){ liberarBoton(btn); msg.innerHTML='<div class="aviso">⚠️ '+esc(err.message||err)+'</div>'; }
}

/* ================= COMPLETAR FALTANTES (residente / admin / jeisson) =================
 * Mini-interfaz para agregar/corregir personas que no reportaron o quedaron presentes sin CC.

 * responsable de la cuadrilla. */
function proyectoFromCC(cc){ const m=String(cc||'').match(/^(\d{4})/); return m?m[1]:''; }
function seccionCompletar(d){
  if(['residente','admin','asistencia_plus','asistencia_plus_dren','asistencia_plus_uf3','asistencia_plus_tm2','residente_odt','residente_odl','residente_dren'].indexOf(STATE.rol)<0) return '';
  const faltantes=d.faltantes||[];
  const comp=[];
  // Los "presente sin CC" ya vienen en faltantes como sin_reportar (incompleto=true), así que basta
  // con recorrer faltantes — sin duplicar. Etiqueta según sea incompleto o nunca reportado.
  faltantes.filter(f=>f.tipo==='sin_reportar').forEach(f=>comp.push({codigo:f.codigo,cedula:f.cedula,nombre:f.nombre,cargo:f.cargo,cuadrilla:f.cuadrilla,tag: f.incompleto?'presente sin CC':'sin reportar'}));
  // D85: personal EVENTUAL (estado=eventual en PERSONAL, p. ej. el encargado Javier): nunca aparece
  // como faltante ni en los KPI/avisos de "sin reportar", pero se ofrece AQUÍ para marcarlo presente
  // los dom/fest u ocasiones puntuales. Solo si aún no tiene fila reportada ese día (si ya se subió,
  // se corrige desde el detalle por cuadrilla, como cualquier fila).
  const repKeys={}; (d.filas||[]).forEach(f=>{ repKeys[String(f.codigo||'').trim()||('CED:'+String(f.cedula||'').trim())]=1; });
  (d.eventuales||[]).forEach(p=>{
    const k=String(p.codigo||'').trim()||('CED:'+String(p.cedula||'').trim());
    if(repKeys[k]) return;
    comp.push({codigo:p.codigo,cedula:p.cedula,nombre:p.nombre,cargo:p.cargo,cuadrilla:p.cuadrilla,tag:'eventual'});
  });
  if(!comp.length) return '';
  STATE._comp=comp;
  let h='<div style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;">'
    + '<span style="font-family:\'Syne\',sans-serif;font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;">Completar faltantes ('+comp.length+')</span>'
    + '<button class="mini-btn" onclick="toggleLista(\'listaCompletar\',this)">Mostrar</button></div>';
  // Diferido: este bloque nace oculto y es el más pesado del resumen (una ficha con CC, turno, horario
  // y motivo por CADA faltante). Su HTML se arma al pulsar "Mostrar"; el resultado es idéntico.
  h+='<div id="listaCompletar" class="card" style="display:none;"></div>';
  LAZY['listaCompletar']=function(){ return completarListaHtml(d, comp); };
  return h;
}
function completarListaHtml(d, comp){
  const catMotivos=d.catMotivos||[], j=Object.assign({},d.jornada||{});
  // D77: en domingo/festivo el backend puede mandar la jornada vacía; se pre-llena el horario típico
  // (07:00–15:00; 8h − 1h almuerzo = 7h Dom/Fest) para completar faltantes sin teclear las horas.
  if(j.tipo==='domfest' && !j.entrada){ j.entrada='07:00'; j.salida='15:00'; }
  // D72: turnos para completar faltantes (mismo pre-llenado de horas que el formulario del capataz).
  // D81: filtrados por día (sábado solo con variante sabatina; domingo/festivo sin turnos).
  const turnos=d.turnos||[]; STATE._compTurnos=turnos;
  const turnoOpts = turnoOptsHtml(turnos, '1');
  const esDomFest = tipoJornadaDeFecha(STATE.fecha, d.festivos||[])==='domfest';
  // Las <option> de motivos son las mismas para todas las personas: se arman UNA vez, no por ficha.
  const motivoOpts = catMotivos.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  // D78: el CC se elige con el buscador ccPickerHtml (frecuentes del área primero + catálogo completo).

  // D81: en domingo/festivo trabaja solo el personal disponible (revuelto de cuadrillas y responsables),

  // los demás se dejan sin tocar (no cuentan como ausentes — el domingo no trabajado es lo normal).

  // mismo cálculo. UF3 sigue fuera por decisión de D101 (ver `usaFlujoDomFest`).

    // D115: el descuento de almuerzo se dice EXPLÍCITO. El cálculo (horas-nomina.js) resta 1h solo si el
    // rango cubre completo 12:00–13:00, así que 07:00–15:00 = 7h pero 07:00–14:00 = 6h — quien trabajó
    // de corrido sin almorzar tiene que reportar la salida real (14:00) y le quedan 6h, no 7. Es la

    h+='<div class="aviso" style="margin:0 0 10px;">📅 <b>Domingo/festivo:</b> marca únicamente a quienes trabajaron (CC + horario, pre-llenado 07:00–15:00 = 7h Dom/Fest; si hicieron más, hasta 2h van a extras Dom/Fest). A los demás <b>no los marques</b>: no cuentan como ausentes.'
      + '<br><small style="color:var(--muted)">Ojo con el almuerzo: se descuenta 1h cuando el horario cubre 12:00–13:00. Por eso <b>07:00–15:00 = 7h</b> pero <b>07:00–14:00 = 6h</b>.</small></div>';
    // D115: en ODT/ODL los capataces SÍ reportan por cuadrilla también en dom/fest, y ese envío pisa
    // fecha+cuadrilla (D03/D107): si el capataz manda su reporte DESPUÉS, borra lo marcado aquí.
    if(esVistaDrenajes()){
      h+='<div class="aviso" style="margin:0 0 10px;">⚠️ <b>Drenajes:</b> si el capataz envía su cuadrilla <b>después</b> de que guardes aquí, su envío <b>pisa toda la cuadrilla</b> de ese día y se pierde lo que marcaste. En dom/fest súbelo por un solo canal — y si ambos lo hacen, que este resumen vaya de último.</div>';
    }
  }
  // D81: buscador — la lista trae a TODO el personal esperado (útil en dom/fest, donde solo se busca a

  h+='<input type="text" id="compFiltro" placeholder="Buscar por nombre, cuadrilla o cargo…" oninput="compFiltrar(this.value)" style="margin-bottom:10px;">';
  // Mejora jul-2026: conforme marca gente (presente/ausente), cada persona sube a este bloque fijo
  // "Marcados para subir" y se queda a la vista — así no se pierde en la lista al buscar al siguiente
  // ni al filtrar, y los revisa juntos antes de "Guardar". El buscador solo filtra los pendientes de
  // abajo (#compPendientes); los ya marcados nunca se ocultan.
  h+='<div id="compMarcados" style="display:none;border:1px solid rgba(245,166,35,0.4);border-radius:10px;padding:4px 10px 2px;margin-bottom:10px;">'

  h+='<div id="compPendientes">';
  comp.forEach((p,i)=>{
    h+=`<div class="comp-item" id="comp-item-${i}" data-search="${esc((String(p.nombre)+' '+String(p.cargo)+' '+String(p.cuadrilla)).toLowerCase())}" style="border-bottom:1px solid rgba(46,52,80,0.5);padding:10px 0;">`
     + `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;">`
     + `<div class="nm"><b>${esc(p.nombre)}</b><small style="color:var(--muted)">${esc(p.cargo)} · ${esc(p.cuadrilla)} · ${esc(p.tag)}</small></div>`
     + `<select class="comp-estado" id="comp-est-${i}" onchange="compToggle(${i})" style="max-width:160px;"><option value="">— Pendiente</option><option value="Si">Presente</option><option value="No">Ausente</option></select>`
     + `</div>`
     + `<div id="comp-pres-${i}" style="display:none;margin-top:8px;"><div class="row">`
     + `<div class="field"><label>Centro de Costo</label>${ccPickerHtml('comp-cc-'+i, '')}</div>`
     + (turnoOpts ? `<div class="field" style="max-width:140px;"><label>Turno</label><select id="comp-tur-${i}" onchange="compTurnoChange(${i})">${turnoOpts}</select></div>` : '')
     + `<div class="field" style="max-width:120px;"><label>Entrada</label><input type="time" id="comp-ent-${i}" value="${esc(j.entrada||'')}"></div>`
     + `<div class="field" style="max-width:120px;"><label>Salida</label><input type="time" id="comp-sal-${i}" value="${esc(j.salida||'')}"></div>`
     + `</div></div>`
     + `<div id="comp-aus-${i}" style="display:none;margin-top:8px;"><select id="comp-mot-${i}"><option value="">Motivo de ausencia…</option>${motivoOpts}</select></div>`
     + `</div>`;
  });
  h+='</div>'; // /#compPendientes
  h+='<button class="btn" style="margin-top:12px;" id="compSave" onclick="guardarCompletar()">Guardar faltantes →</button><div id="compMsg" style="margin-top:8px;"></div>';
  return h;
}
function compToggle(i){
