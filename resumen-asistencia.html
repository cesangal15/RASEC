async function guardarCompletar(){
  const comp=STATE._comp||[], filas=[];
  comp.forEach((p,i)=>{
    const sel=document.getElementById('comp-est-'+i);
    const est=sel?sel.value:'';   // la lista se arma al desplegarla: sin desplegar no hay nada marcado
    if(!est) return;
    if(est==='Si'){
      const cc=document.getElementById('comp-cc-'+i).value.trim();
      const turSel=document.getElementById('comp-tur-'+i);
      filas.push({ codigo:p.codigo, cedula:p.cedula, nombre:p.nombre, cargo:p.cargo, cuadrilla:p.cuadrilla,
        cc, proyecto:proyectoFromCC(cc), hora_entrada:document.getElementById('comp-ent-'+i).value,
        hora_salida:document.getElementById('comp-sal-'+i).value, presente:'Si', motivo_ausencia:'', turno:turSel?turSel.value:'1' });
    } else {
      filas.push({ codigo:p.codigo, cedula:p.cedula, nombre:p.nombre, cargo:p.cargo, cuadrilla:p.cuadrilla,
        cc:'', proyecto:'', hora_entrada:'', hora_salida:'', presente:'No', motivo_ausencia:document.getElementById('comp-mot-'+i).value, turno:'' });
    }
  });
  if(!filas.length){ alert('No marcaste el estado de ninguna persona.'); return; }
  if(filas.some(f=>f.presente==='No' && !f.motivo_ausencia)){ alert('Falta el motivo de alguna persona marcada como ausente.'); return; }
  // D106: ídem — "Completar faltantes" escribe por persona y también quedaba sin fecha.
  if(!fechaValida(STATE.fecha)){ alert('⚠️ No se puede guardar sin fecha. Elige el día en el campo "Fecha".'); return; }
  const msg=document.getElementById('compMsg'); msg.innerHTML='<div class="aviso">⏳ Guardando…</div>';
  const btn=bloquearBoton('compSave');   // D125: anti doble toque
  if(!btn && document.getElementById('compSave')) return;   // ya había un envío en vuelo
  try{
    perfReset();
    const data=await perfFetch('asistencia_individual (faltantes)', APPS_SCRIPT_URL, { method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'asistencia_individual', fecha:STATE.fecha, reporta:STATE.usuario, usuario:STATE.usuario, filas }) });
    perfTabla('guardar faltantes');
    if(data.ok){ STATE.exportCache={}; cargarResumen(); }   // re-render: el botón se rehace solo
    else { liberarBoton(btn); msg.innerHTML='<div class="aviso">⚠️ '+esc(data.error||'error')+'</div>'; }
  }catch(err){ liberarBoton(btn); msg.innerHTML='<div class="aviso">⚠️ '+esc(err.message||err)+'</div>'; }
}

/* ================= SEGUIMIENTO DE AUSENCIAS POR RANGO (D94) =================
 * Pedido del usuario (jul-2026): "de cierta fecha a cierta fecha, ver quiénes faltaron y filtrarlo
 * según el motivo, para hacerle seguimiento al personal". Va en ESTA pantalla (no en una nueva) porque
 * quien hace el seguimiento es el mismo que revisa el resumen (residente / jeisson / duvan / admin) y
 * así reusa el guard, el filtro por área del backend y los catálogos que ya trae la página.
 *   - Consulta el endpoint `?action=ausencias&desde=&hasta=` (solo lectura, acotado al área del usuario).
 *   - Filtros en el cliente: motivo, cuadrilla y buscador por nombre/cargo.
 *   - Dos vistas: POR PERSONA (reincidencias, con el detalle de fechas) y POR FECHA (el día a día).
 *   - Checkbox "incluir no reportados": días en que la cuadrilla reportó pero a la persona no la
 *     incluyeron. No es una ausencia confirmada — por eso va aparte y apagado por defecto.
 *   - Descarga CSV de lo filtrado, para adjuntar al seguimiento (no es el Parte de Navision).
 * Es independiente de la fecha del resumen: cambiar el día de arriba no borra esta consulta. */
const AUS_SIN_REPORTE='(no reportado)';
function primerDiaDelMes(f){ return String(f||'').slice(0,8)+'01'; }
function ausInit(){
  const a=STATE.aus;
  if(!a.hasta) a.hasta=STATE.fecha;
  if(!a.desde) a.desde=primerDiaDelMes(STATE.fecha);
}
function seccionAusencias(){
  ausInit(); const a=STATE.aus;
  let h='<div style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;">'
    + '<span style="font-family:\'Syne\',sans-serif;font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;">🔎 Seguimiento de ausencias (rango)</span>'
    + `<button class="mini-btn" onclick="ausToggle(this)">${a.abierto?'Ocultar':'Mostrar'}</button></div>`;
  h+=`<div id="ausPanel" class="card" style="display:${a.abierto?'block':'none'};">`;
  h+='<p style="font-size:12px;color:var(--muted);margin-bottom:10px;">Quién faltó entre dos fechas y por qué motivo, para el seguimiento del personal. Solo lectura: no modifica ninguna asistencia.</p>';
  h+='<div class="row">'
    + `<div class="field" style="max-width:170px;"><label>Desde</label><input type="date" id="ausDesde" value="${esc(a.desde)}"></div>`
    + `<div class="field" style="max-width:170px;"><label>Hasta</label><input type="date" id="ausHasta" value="${esc(a.hasta)}"></div>`
    + '<div class="field" style="flex:0;"><button class="btn" onclick="ausConsultar()">Consultar →</button></div>'
    + '</div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">'
    + '<button class="mini-btn" onclick="ausRangoRapido(\'mes\')">Este mes</button>'
    + '<button class="mini-btn" onclick="ausRangoRapido(\'30\')">Últimos 30 días</button>'
    + '<button class="mini-btn" onclick="ausRangoRapido(\'mesant\')">Mes pasado</button>'
    + '</div>';
  h+='<div id="ausFiltros" style="margin-top:14px;"></div><div id="ausResultados"></div>';
  h+='</div>';
  return h;
}
function ausToggle(btn){
  STATE.aus.abierto=!STATE.aus.abierto;
  const el=document.getElementById('ausPanel'); if(el) el.style.display=STATE.aus.abierto?'block':'none';
  if(btn) btn.textContent=STATE.aus.abierto?'Ocultar':'Mostrar';
}
// Atajos de rango. Fechas en hora de Bogotá (D50: nunca toISOString).
function ausRangoRapido(cual){
  const hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  const p=hoy.split('-'); const y=Number(p[0]), m=Number(p[1]);
  let desde=hoy, hasta=hoy;
  if(cual==='mes'){ desde=primerDiaDelMes(hoy); }
  else if(cual==='30'){ const d=new Date(y, m-1, Number(p[2])); d.setDate(d.getDate()-29);
    desde=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  else if(cual==='mesant'){ const ini=new Date(y, m-2, 1), fin=new Date(y, m-1, 0);
    const f=x=>x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);
    desde=f(ini); hasta=f(fin); }
  STATE.aus.desde=desde; STATE.aus.hasta=hasta;
  const de=document.getElementById('ausDesde'), ha=document.getElementById('ausHasta');
  if(de) de.value=desde; if(ha) ha.value=hasta;
  ausConsultar();
}
async function ausConsultar(){
  const de=document.getElementById('ausDesde'), ha=document.getElementById('ausHasta');
  const a=STATE.aus;
  a.desde=de?de.value:a.desde; a.hasta=ha?ha.value:a.hasta;
  if(!a.desde || !a.hasta){ alert('Elige las dos fechas del rango.'); return; }
  if(a.hasta < a.desde){ alert('El rango está invertido: "Hasta" es anterior a "Desde".'); return; }
  a.cargando=true; a.error=''; a.data=null; a.motivo=''; a.cuadrilla=''; a.abiertos={};
  renderAusFiltros(); renderAusResultados();
  try{
    const url=`${APPS_SCRIPT_URL}?action=ausencias&desde=${a.desde}&hasta=${a.hasta}`
      + `&usuario=${encodeURIComponent(STATE.usuario)}&area=${encodeURIComponent(STATE.areaFiltro||'')}`;
    perfReset();
    const data=await perfFetch('ausencias (rango)', url);
    perfTabla('ausencias '+a.desde+' → '+a.hasta);
    if(!data.ok) throw new Error(data.error||'ausencias');
    // Backend sin redesplegar: doGet devuelve {ok:true, msg:'API Asistencias viva'} para una acción que
    // aún no conoce. Se detecta por la ausencia de `filas` y se avisa con la causa real.
    if(!data.filas) throw new Error('El Apps Script de asistencias todavía no tiene el endpoint de ausencias. Redespliega CodigoAsistencias.gs (editar implementación → versión nueva, misma URL).');
    a.data=data;
  }catch(err){ a.error=err.message||String(err); }
  a.cargando=false;
  renderAusFiltros(); renderAusResultados();
}
// Universo consultado según el checkbox de "no reportados" (antes de los filtros de motivo/cuadrilla/texto).
function ausUniverso(){
  const a=STATE.aus, d=a.data; if(!d) return [];
  return a.incluirSinRep ? (d.filas||[]).concat(d.sinReportar||[]) : (d.filas||[]).slice();
}
function ausFilas(){
  const a=STATE.aus, q=(a.q||'').trim().toLowerCase();
  return ausUniverso().filter(f=>
      (!a.motivo    || f.motivo===a.motivo)
   && (!a.cuadrilla || f.cuadrilla===a.cuadrilla)
   && (!q || (String(f.nombre)+' '+String(f.cargo)+' '+String(f.cuadrilla)).toLowerCase().indexOf(q)>=0))
   .sort((x,y)=> x.fecha===y.fecha ? (x.nombre<y.nombre?-1:1) : (x.fecha<y.fecha?1:-1));
}
function ausKey(f){ return String(f.codigo||'').trim() || ('CED:'+String(f.cedula||'').trim()); }
// Controles de filtro: viven FUERA de #ausResultados para no perder el foco del buscador al teclear
// (mismo patrón que el filtro de gestión de personal).
function renderAusFiltros(){
  const box=document.getElementById('ausFiltros'); if(!box) return;
  const a=STATE.aus;
  if(!a.data){ box.innerHTML=''; return; }
  const uni=ausUniverso();
  const motivos=[]; uni.forEach(f=>{ if(motivos.indexOf(f.motivo)<0) motivos.push(f.motivo); }); motivos.sort();
  const cuads=[];   uni.forEach(f=>{ if(cuads.indexOf(f.cuadrilla)<0) cuads.push(f.cuadrilla); }); cuads.sort();
  let h='<div class="row">'
    + '<div class="field"><label>Motivo</label><select onchange="ausSetFiltro(\'motivo\',this.value)">'
    +   `<option value="">Todos los motivos</option>`
    +   motivos.map(m=>`<option value="${esc(m)}" ${a.motivo===m?'selected':''}>${esc(m)}</option>`).join('')
    + '</select></div>'
    + '<div class="field"><label>Cuadrilla</label><select onchange="ausSetFiltro(\'cuadrilla\',this.value)">'
    +   `<option value="">Todas</option>`
    +   cuads.map(c=>`<option value="${esc(c)}" ${a.cuadrilla===c?'selected':''}>${esc(c)}</option>`).join('')
    + '</select></div>'
    + '<div class="field"><label>Buscar persona</label><input type="text" id="ausQ" placeholder="Nombre, cargo o cuadrilla…" '
    +   `value="${esc(a.q)}" oninput="ausSetTexto(this.value)"></div>`
    + '</div>';
  h+='<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);">'
    + `<label style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;margin:0;cursor:pointer;">`
    +   `<input type="checkbox" style="width:auto;" ${a.incluirSinRep?'checked':''} onchange="ausSetSinRep(this.checked)"> `
    +   `Incluir días <b style="color:var(--text)">no reportados</b> (la cuadrilla reportó, pero a la persona no la incluyeron)</label>`
    + '<span style="flex:1;"></span>'
    + `<button class="mini-btn" onclick="ausSetVista('persona')" style="${a.vista==='persona'?'border-color:var(--accent);color:var(--accent-txt);':''}">Por persona</button>`
    + `<button class="mini-btn" onclick="ausSetVista('fecha')" style="${a.vista==='fecha'?'border-color:var(--accent);color:var(--accent-txt);':''}">Por fecha</button>`
    + '</div>';
  box.innerHTML=h;
}
function ausSetFiltro(k, v){ STATE.aus[k]=v; renderAusResultados(); }
// Clic en una línea del desglose "Por motivo": filtra por ese motivo, o lo quita si ya estaba puesto.
function ausMotivoClick(i){
  const m=(STATE.aus._motivos||[])[i]; if(m==null) return;
  STATE.aus.motivo = (STATE.aus.motivo===m) ? '' : m;
  renderAusFiltros(); renderAusResultados();
}
function ausSetTexto(v){ STATE.aus.q=v; renderAusResultados(); }     // el input no se repinta: no pierde foco
function ausSetVista(v){ STATE.aus.vista=v; renderAusFiltros(); renderAusResultados(); }
function ausSetSinRep(v){ STATE.aus.incluirSinRep=v; if(STATE.aus.motivo===AUS_SIN_REPORTE && !v) STATE.aus.motivo=''; renderAusFiltros(); renderAusResultados(); }
// El detalle se abre por índice de pintado (id DOM seguro) pero se RECUERDA por clave de persona, para
// que siga abierto al cambiar un filtro (que repinta la lista).
function ausToggleDetalle(i, btn){
  const k=(STATE.aus._orden||[])[i]; if(k==null) return;
  STATE.aus.abiertos=STATE.aus.abiertos||{};
  STATE.aus.abiertos[k]=!STATE.aus.abiertos[k];
  const el=document.getElementById('ausdet-'+i); if(el) el.style.display=STATE.aus.abiertos[k]?'block':'none';
  if(btn) btn.textContent=STATE.aus.abiertos[k]?'Ocultar':'Ver fechas';
}
function renderAusResultados(){
  const box=document.getElementById('ausResultados'); if(!box) return;
  const a=STATE.aus;
  if(a.cargando){ box.innerHTML='<div class="loading">⏳ Consultando el rango…</div>'; return; }
  if(a.error){ box.innerHTML='<div class="aviso">⚠️ '+esc(a.error)+'</div>'; return; }
  if(!a.data){ box.innerHTML='<p style="font-size:12.5px;color:var(--muted);margin-top:12px;">Elige el rango y pulsa <b>Consultar</b>.</p>'; return; }
  const filas=ausFilas();
  const personas={}; filas.forEach(f=>{ personas[ausKey(f)]=1; });
  const dias={};     filas.forEach(f=>{ dias[f.fecha]=1; });
  let h='<div class="kpis" style="margin-top:14px;">'
    + `<div class="kpi"><div class="k-val">${filas.length}</div><div class="k-lbl">Ausencias</div></div>`
    + `<div class="kpi"><div class="k-val">${Object.keys(personas).length}</div><div class="k-lbl">Personas</div></div>`
    + `<div class="kpi"><div class="k-val">${Object.keys(dias).length}</div><div class="k-lbl">Días con ausencias</div></div>`
    + '</div>';
  h+=`<p style="font-size:11px;color:var(--muted);margin:2px 0 12px;">Rango ${esc(a.data.desde)} → ${esc(a.data.hasta)} (${esc(a.data.dias)} día(s)). `
    + `${a.data.filas.length} ausencia(s) con motivo`
    + (a.incluirSinRep ? ` · ${(a.data.sinReportar||[]).length} día(s)-persona no reportados` : '')
    + '.</p>';
  if(!filas.length){
    h+='<p class="empty-state" style="padding:18px;">Sin ausencias con estos filtros.</p>';
    box.innerHTML=h; return;
  }
  // Desglose por motivo (clic = filtra). Es la lectura rápida del "por qué" del periodo.
  const porMotivo={}; ausUniverso().forEach(f=>{ porMotivo[f.motivo]=(porMotivo[f.motivo]||0)+1; });
  const motivosOrd=Object.keys(porMotivo).sort((x,y)=>porMotivo[y]-porMotivo[x]);
  STATE.aus._motivos=motivosOrd;   // el clic va por índice: el texto del motivo puede traer comillas
  h+='<div class="section-title" style="margin:8px 0 6px;">Por motivo</div>'
    + '<p style="font-size:11px;color:var(--muted);margin:-4px 0 6px;">Clic en un motivo para filtrar; otro clic lo quita.</p>'
    + '<div class="card" style="background:var(--surface2);">';
  motivosOrd.forEach((m,i)=>{
    const sel=a.motivo===m;
    h+=`<div class="cuad-row" style="cursor:pointer;${sel?'color:var(--accent-txt);':''}" onclick="ausMotivoClick(${i})">`
      + `<span>${esc(m)}${sel?' ✓':''}</span><b>${porMotivo[m]}</b></div>`;
  });
  h+='</div>';

  if(a.vista==='persona'){
    // Reincidencias: quién falta más en el periodo (lo que sirve para el seguimiento).
    const map={};
    filas.forEach(f=>{ const k=ausKey(f);
      if(!map[k]) map[k]={ nombre:f.nombre, cargo:f.cargo, cuadrilla:f.cuadrilla, codigo:f.codigo, n:0, motivos:{}, fechas:[] };
      map[k].n++; map[k].motivos[f.motivo]=(map[k].motivos[f.motivo]||0)+1; map[k].fechas.push(f);
    });
    const orden=Object.keys(map).sort((x,y)=> map[y].n-map[x].n || (map[x].nombre<map[y].nombre?-1:1));
    STATE.aus._orden=orden;
    h+='<div class="section-title" style="margin:16px 0 6px;">Por persona ('+orden.length+')</div><div class="card" style="background:var(--surface2);">';
    orden.forEach((k,i)=>{
      const p=map[k], det=(STATE.aus.abiertos||{})[k];
      const mot=Object.keys(p.motivos).sort((x,y)=>p.motivos[y]-p.motivos[x])
        .map(m=>`${esc(m)}${p.motivos[m]>1?' ×'+p.motivos[m]:''}`).join(' · ');
      h+='<div style="border-bottom:1px solid rgba(46,52,80,0.5);padding:9px 0;">'
        + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;">'
        +   `<div class="nm" style="flex:1;min-width:180px;"><b>${esc(p.nombre)}</b> <small style="color:var(--muted)">${esc(p.cargo)} · ${esc(p.cuadrilla)}${p.codigo?' · cód. '+esc(p.codigo):''}</small>`
        +   `<br><small style="color:var(--muted)">${mot}</small></div>`
        +   `<span style="display:flex;gap:8px;align-items:center;"><span class="badge aus">${p.n} falta(s)</span>`
        +   `<button class="mini-btn" onclick="ausToggleDetalle(${i},this)">${det?'Ocultar':'Ver fechas'}</button></span>`
        + '</div>'
        + `<div id="ausdet-${i}" style="display:${det?'block':'none'};margin-top:6px;">`
        +   p.fechas.map(f=>`<div class="falt-row" style="padding:5px 0;"><span><b style="color:var(--text)">${esc(f.fecha)}</b> <small style="color:var(--muted)">${esc(f.motivo)}</small></span>`
        +     `<small style="color:var(--muted)">${f.reporta?'reportó '+esc(f.reporta):''}</small></div>`).join('')
        + '</div></div>';
    });
    h+='</div>';
  } else {
    // Día a día: útil para cruzar con un frente parado o un día puntual.
    const porFecha={};
    filas.forEach(f=>{ (porFecha[f.fecha]=porFecha[f.fecha]||[]).push(f); });
    const fechas=Object.keys(porFecha).sort().reverse();
    h+='<div class="section-title" style="margin:16px 0 6px;">Por fecha ('+fechas.length+')</div><div class="card" style="background:var(--surface2);">';
    fechas.forEach(fe=>{
      h+=`<div style="border-bottom:1px solid rgba(46,52,80,0.5);padding:9px 0;"><div style="display:flex;justify-content:space-between;">`
        + `<b style="color:var(--accent-txt)">${esc(fe)}</b><span class="badge aus">${porFecha[fe].length} falta(s)</span></div>`;
      porFecha[fe].forEach(f=>{
        h+=`<div class="falt-row" style="padding:5px 0;"><div class="nm"><b>${esc(f.nombre)}</b><small>${esc(f.cargo)} · ${esc(f.cuadrilla)}</small></div>`
         + `<span class="badge ${f.tipo==='sin_reportar'?'sin':'aus'}">${esc(f.motivo)}</span></div>`;
      });
      h+='</div>';
    });
    h+='</div>';
  }
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;"><button class="btn-ghost" onclick="ausCSV()">⬇️ Descargar CSV (${filas.length} fila(s))</button></div>`;
  box.innerHTML=h;
}
// CSV de lo FILTRADO, para adjuntar al seguimiento del personal. UTF-8 con BOM y separador ';' (mismo
// criterio que la digitadora: Excel en español lo abre en columnas sin pasos extra). No es el Parte.
function ausCSV(){
  const filas=ausFilas(); if(!filas.length) return;
  const esc2=v=>{ const s=String(v==null?'':v); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const cab=['Fecha','Codigo','Cedula','Nombre','Cargo','Cuadrilla','Motivo','Tipo','Reporto'];
  const lineas=[cab.join(';')].concat(filas.map(f=>[f.fecha,f.codigo,f.cedula,f.nombre,f.cargo,f.cuadrilla,f.motivo,
    f.tipo==='sin_reportar'?'No reportado':'Ausencia reportada',f.reporta].map(esc2).join(';')));
  const blob=new Blob(['﻿'+lineas.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`Ausencias_${STATE.aus.desde}_a_${STATE.aus.hasta}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// Prefijos de proyecto presentes en el área revisada. Orden estable (numérico ascendente).
function proyectosDelArea(){
  const d=STATE.data||{};
  const set={};
  // D101: el respaldo al catálogo GLOBAL (tierras) solo vale si la vista NO está acotada a un área —
  // si no, a la residente de UF3 le salían los botones de 3701/3702 mientras CC_USADOS estaba vacía.
  const acotada=vistaAcotada(d);
  const pool=(d.catCCUsados&&d.catCCUsados.length) ? d.catCCUsados : (acotada ? [] : (d.catCC||[]));
  pool.forEach(cc=>{ const p=proyectoDeCC(cc); if(p) set[p]=true; });
  // Lo ya reportado ese día manda igual: si hay filas de un proyecto, su botón tiene que estar.
  (d.filas||[]).forEach(f=>{ const p=String(f.proyecto||'').trim(); if(p) set[p]=true; });
  return Object.keys(set).sort();
}
function proyectoDeCC(cc){ const m=String(cc||'').match(/^(\d{4})/); return m?m[1]:''; }
// Proyecto más frecuente entre las filas PRESENTES de una lista (respaldo para ausentes sin histórico).
function proyectoMayoritario(filas){
  const c={};
  filas.forEach(f=>{ if(f.presente!=='Si') return; const p=String(f.proyecto||'').trim(); if(p) c[p]=(c[p]||0)+1; });
  let best='', bestN=0;
  Object.keys(c).forEach(p=>{ if(c[p]>bestN){ bestN=c[p]; best=p; } });
  return best;
}

/* ---------- Clasificador de horas (D72, Opción A) — AHORA EN `horas-nomina.js` (D112) ----------
 * `round2`, `horasNum`, `ovlp`, `jornadaPorDefecto`, `turnoRowFor`, `clasificarHoras` y
 * `tipoJornadaDeFecha` se movieron TAL CUAL al archivo compartido `horas-nomina.js` (cargado arriba,
 * antes de este script) para que `horas-persona.html` — la pantalla de "Horas por persona", que se usa
 * para responder reclamos de pago — calcule EXACTAMENTE lo mismo que este generador del Parte. Dos
 * copias del clasificador acabarían divergiendo; una sola fuente, no.
 * D112 no cambió una línea de lógica: la no-regresión se verificó celda a celda contra la versión
 * anterior con `backend/pruebas/verificar_refactor_horas.js`.
 * Si hace falta un ajuste del cálculo, se decide aparte y se aplica en `horas-nomina.js` (afecta a las

// PROVISIONAL (parámetro abierto, §6 cols H–N): el mapeo fino de Dom-Fest c/s compensación está
// pendiente de confirmar con la empresa (C–G ya se calculan por turno, D72e/D77). No escribe nada;

// El crudo del export NO depende del proyecto (3701/3702 se filtran en el cliente): una sola petición
// por fecha sirve para los dos botones — `exportCache` ya lo reusa; se invalida al cambiar fecha, área
// o al guardar (detalle / faltantes).
async function obtenerExport(fecha){
  if(STATE.exportCache[fecha]) return STATE.exportCache[fecha];
  const data=await perfFetch('export (crudo del día)',
    `${APPS_SCRIPT_URL}?action=export&fecha=${fecha}&usuario=${encodeURIComponent(STATE.usuario)}&area=${encodeURIComponent(STATE.areaFiltro||'')}`);
  if(!data.ok) throw new Error(data.error||'export');

}

// A. No. Recurso: string EXACTO del listado de Trabajadores (Navision lo lee tal cual). Sin match
// (ingreso nuevo / código no catalogado) se construye "codigo| NOMBRE" en MAYÚSCULAS, sin bloqueo (§2/§6).
function noRecurso(codigo, nombre, catTrabajadores){
  const c=String(codigo||'').trim();
  if(c && catTrabajadores[c]) return catTrabajadores[c];
  return `${c}| ${String(nombre||'').toUpperCase()}`;
}
// Construye {codigo: 'codigo| NOMBRE'} desde la hoja "Trabajadores" de la PLANTILLA (columna A, string
// exacto que espera Navision). El código es lo que va antes del '|'. Así el string de la columna A sale
// idéntico al listado oficial sin que el usuario mantenga nada aparte. Si no existe la hoja, devuelve {}.
function mapTrabajadoresDeWb(wb){
  const map={}; const sh=wb.Sheets['Trabajadores']; if(!sh) return map;
  const rows=XLSX.utils.sheet_to_json(sh,{header:1});
  rows.forEach(r=>{
    const val=String((r&&r[0])!=null?r[0]:'').trim();
    const i=val.indexOf('|');
    if(i>0){ const cod=val.slice(0,i).trim(); if(cod) map[cod]=val; }
  });
  return map;
}
/* ---------- Tope de 10 h/día del sistema externo (Navigation/Navision) — SOLO EL EXPORT ----------
 * El sistema donde el dueño SUBE las horas no acepta más de 10 horas trabajadas en un día para una
 * persona. Es una limitación de ESE sistema (no lo tienen actualizado), no de nuestra nómina ni de la
 * ley: nuestro cálculo está bien y por eso NO se toca `clasificarHoras`/horas-persona/el detalle por
 * cuadrilla — esas siguen mostrando lo REALMENTE trabajado. Solo el archivo que se sube va topado.
 *
 * Dónde aprieta: el turno 1 (7.5 base + 2 extra = 9.5) nunca llega; los turnos nocturnos de 8.5 h base
 * + 2 h de extra dan 10.5 y el sistema los rechaza. Se recorta SILENCIOSAMENTE la EXTRA (la base es
 * fija) hasta dejar el total en 10, quitando desde la ÚLTIMA hora trabajada: primero la extra diurna
 * (la que cae tras el corte nocturno de las 06:00), luego la nocturna. Ej.: turno hasta 04:30 + 2 h
 * hasta 06:30 → 1.5 noct + 0.5 diurna; se quita la 0.5 diurna → queda 1.5 noct. Turno hasta 02:30 + 2 h
 * hasta 04:30 (todo nocturno) → la nocturna baja de 2 a 1.5.
 *
 * El RECARGO nocturno (col G) NO cuenta para el total: son las MISMAS horas ordinarias con recargo
 * (van en otra columna pero no se suman dos veces). Dom/Fest tampoco llega al tope (7+2 = 9).
 *
 * Devuelve el objeto de horas ajustado y `recorte` = las horas que se quitaron, para AVISARLO en el
 * resumen: hay que sumar esas horas extra en OTRO día del corte para no dejar de pagarlas. */
const TOPE_HORAS_DIA = 10;
function aplicarTope10(cl){
  const total=(cl.ordinarias||0)+(cl.ord_domfest||0)+(cl.extra_diurna||0)+(cl.extra_nocturna||0)+(cl.extra_domfest||0);
  if(total <= TOPE_HORAS_DIA + 0.001) return { cl, recorte:0 };
  let sobra=round2(total-TOPE_HORAS_DIA);
  const out=Object.assign({}, cl);
  // Recorta desde la última hora trabajada: extra diurna (post-06:00) → nocturna → dom/fest (respaldo).
  ['extra_diurna','extra_nocturna','extra_domfest'].forEach(function(k){
    if(sobra<=0.001) return;
    const v=out[k]||0, quita=Math.min(v, sobra);
    out[k]=round2(v-quita); sobra=round2(sobra-quita);
  });
  const recorte=round2((total-TOPE_HORAS_DIA)-Math.max(0,sobra));
  return { cl:out, recorte };
}

// Fila A–R (18 columnas) de la hoja Parte para una persona del día. Ausente: TODAS las horas en 0 (§6).
function buildParteRow(f, proyectoStr, cfg, tipoJornada, catTrabajadores, turnoRow){
  const row=new Array(18).fill('');
  row[0]=noRecurso(f.codigo, f.nombre, catTrabajadores);   // A No. Recurso
  row[1]='';                                                // B Control de partes: siempre vacía
  const ausente = f.presente==='No';
  if(ausente){
    row[2]=0; row[3]=0; row[4]=0; row[5]=0; row[6]=0;       // C–G en 0
  } else {
    // Tope de 10 h/día del sistema externo — SOLO aquí, en el archivo que se sube (ver aplicarTope10).
    const clReal=clasificarHoras(tipoJornada, f.hora_entrada, f.hora_salida, cfg, turnoRow);
    const cap=aplicarTope10(clReal); const cl=cap.cl;
    row[2]=cl.ordinarias; row[3]=cl.ord_domfest; row[4]=cl.extra_diurna; row[5]=cl.extra_nocturna;
    row[6]=cl.recargo_noct_ord;                             // G Recargo hora nocturna ord (D72) — no se topa
    if(cl.extra_domfest) row[7]=cl.extra_domfest;           // H Horas extras diurnas Dom/Fest (D81, máx 2h)
    if(cl.domfest_diurna_scomp) row[11]=cl.domfest_diurna_scomp;   // L Hora Diurna Ord. Dom/Fest s/Comp (criterio nómina)
    row._aviso = cl.avisoDomFest;      // Dom/Fest: solo avisa si hubo MÁS de la jornada base (posibles extras H–N)
    row._avisoExtra = cl.avisoExtra;   // extras > max_extras_dia en día normal: revisar a mano
    row._recorte10 = cap.recorte;      // horas de extra que se quitaron por el tope de 10 h (avisar en resumen)
    row._nombre = f.nombre;
  }
  // Resto de H–N (I–K, M–N) vacías: Dom/Fest c/comp s/comp — revisión manual solo en domingo/festivo (§6)
  row[14]=proyectoStr;                                      // O No. Proyecto
  row[15]=ausente? '' : (f.cc||'');                          // P Centro de coste
  row[16]=ausente? 'Si':'No';                                // Q Ausente
  row[17]=ausente? (f.motivo_ausencia||'') : '';             // R Motivo ausencia
  return row;
}

/* ---------- Canal "solo extras" del admin (D73) ----------
 * Días normales (diurna/nocturna): al admin NO se le ponen horas ordinarias — solo sus 1–2 horas en la
 * columna de extras (E diurna / F nocturna), el resto en 0 (confirmado con Navision, jul-2026).
 * Domingo/festivo: las horas van a **D Horas ordinarias dom/fest** (NO a extras), con tope de **7h** ese
 * día (aclaración del dueño, jul-2026). Ausente=No.
 * Flag conmutable: si un import real de Navision rechaza el `0` en las horas ordinarias de una fila con
 * Ausente=No, voltear a `false` para escribir celda VACÍA en vez de 0. */
const EXTRAS_ORDINARIAS_EN_CERO = true;
const MAX_HORAS_EXTRA   = 2;   // tope de horas extra en día normal (diurna/nocturna)
const MAX_HORAS_DOMFEST = 7;   // tope de horas en domingo/festivo (van a ordinarias dom/fest, col D)

// Fila A–R (18 columnas) de la extra del admin. Día normal: todas las horas en 0 (o vacío según el flag)
// salvo la columna del tipo (E diurna / F nocturna), sin ordinarias. Dom/Fest: las horas van a D (Horas
// ordinarias dom/fest), topadas a 7h. Ausente=No, sin motivo.
function buildAdminExtraRow(ex, proyectoStr, adminRecurso, cfg){
  const row=new Array(18).fill('');
  const cero = EXTRAS_ORDINARIAS_EN_CERO ? 0 : '';
  row[0]=adminRecurso;                 // A No. Recurso (de CONFIG.admin_recurso, string exacto)
  row[1]='';                           // B vacía
  row[2]=cero; row[3]=cero; row[4]=cero; row[5]=cero;   // C–F horas: 0 (o vacío) salvo la que aplique
  /* D142 — el reparto a columnas se pide ahora a `clasificarExtraAdmin` (horas-nomina.js), el mismo
   * archivo compartido que ya calcula las horas de cualquier trabajador. NO cambia una sola celda: es
   * la misma regla que estaba escrita aquí (D73 día normal, D120/D124 dom/fest, topes desde CONFIG),
   * movida a la casa donde vive el cálculo de nómina. El motivo es el de siempre: la pantalla de
   * revisión de horas (`horas-persona.html`) tiene que enseñar EXACTAMENTE lo que se importó a
   * Navision, y con el cálculo aquí dentro tendría que copiarlo — dos copias divergen.
   *
   * Recordatorio de la regla, que no cambia: día normal = solo la extra, sin ordinarias, en la columna
   * de su tipo (E diurna / F nocturna) topada a `max_extras_dia`; dom/fest = las primeras
   * `domfest_tope` horas a **D Horas ordinarias Dom/Fest** y lo que pase, hasta `max_extras_dia`, a
   * **H Horas extras diurnas Dom/Fest** (D120: antes se perdían 2h en silencio). Las constantes
   * MAX_HORAS_EXTRA / MAX_HORAS_DOMFEST siguen siendo el respaldo cuando CONFIG no trae el tope. */
  const cl=clasificarExtraAdmin(ex, Object.assign({ max_extras_dia:MAX_HORAS_EXTRA, domfest_tope:MAX_HORAS_DOMFEST }, cfg||{}));
  if(cl.extra_diurna)   row[4]=cl.extra_diurna;   // E Horas extras diurnas
  if(cl.extra_nocturna) row[5]=cl.extra_nocturna; // F Horas extras nocturnas
  if(ex.tipo==='domfest'){
    row[3]=cl.ord_domfest;                        // D Horas ordinarias Dom/Fest
    if(cl.extra_domfest) row[7]=cl.extra_domfest; // H Horas extras diurnas Dom/Fest
  }
  row[14]=proyectoStr;                 // O No. Proyecto (string de CONFIG, igual que el resto)
  row[15]=ex.cc;                       // P Centro de coste (exacto, el guardado)
  row[16]='No';                        // Q Ausente
  row[17]='';                          // R Motivo
  return row;
}

async function generarExcel(proyecto){
  const msg=document.getElementById('exportMsg');
  if(!STATE.tplBuf){ msg.innerHTML='<div class="aviso">⚠️ Primero sube la plantilla oficial (.xlsx).</div>'; return; }
  // D74 (idea 3): avisa si vas a descargar con gente SIN REPORTAR (por si se pasó a alguien).
  // D81: en domingo/festivo NO se avisa — ese día trabaja solo el personal disponible y lo normal es
  // que casi todos queden sin reportar (no es un olvido; al Parte van solo los marcados presentes).
  // D115: aplica también a DRENAJES (antes solo tierras). En ODT/ODL el domingo tampoco trabaja la obra
  // entera, así que el aviso listaba a casi toda la gente como si faltara y entrenaba a saltárselo — el
  // día que sí hay un olvido (entre semana, donde el aviso se conserva) ya no se lee. UF3 sigue con el
  // aviso todos los días (D101).
  const esDomFestExp = tipoJornadaDeFecha(STATE.fecha, (STATE.data&&STATE.data.festivos)||[])==='domfest';
  const sinRep=(esDomFestExp && usaFlujoDomFest()) ? [] : ((STATE.data&&STATE.data.faltantes)||[]).filter(f=>f.tipo==='sin_reportar');
  if(sinRep.length){
    const nombres=sinRep.slice(0,12).map(f=>'  • '+f.nombre).join('\n')+(sinRep.length>12?`\n  …y ${sinRep.length-12} más`:'');
    if(!confirm(`⚠️ Hay ${sinRep.length} persona(s) SIN REPORTAR hoy:\n\n${nombres}\n\nSi descargas ahora NO quedarán en el archivo. Lo correcto es completarlas (arriba en "Completar faltantes") o marcarlas ausentes.\n\n¿Descargar de todas formas?`)) { msg.innerHTML=''; return; }
  }
  msg.innerHTML='<div class="aviso">⏳ Generando…</div>';
  try{
    perfReset();
    // SheetJS ya no viene en el <head>: se carga aquí (o ya está, si el navegador la precargó ocioso).
    // Va en PARALELO con el crudo del día, no encadenado, para no sumar las dos esperas.
    const [ , data ] = await Promise.all([ ensureXLSX(), obtenerExport(STATE.fecha) ]);
    perfTabla('generar Excel '+proyecto);
    const cfg=data.config||{}, festivos=data.festivos||[], turnos=data.turnos||[];
    // D101: el string de proyecto se busca por CLAVE (`proyecto_` + prefijo), no con un ternario de dos
    // valores: un proyecto nuevo solo necesita su fila en CONFIG, sin tocar código. Si falta o quedó en
    // "PENDIENTE", se avisa con la causa EXACTA y se usa el número pelado (nunca se inventa el string).
    const claveProy='proyecto_'+proyecto;
    const proyectoCfg=String(cfg[claveProy]||'').trim();
    const proyectoStr = (proyectoCfg && proyectoCfg!=='PENDIENTE') ? proyectoCfg : proyecto;
    if(!proyectoCfg){
      msg.innerHTML='<div class="aviso">⚠️ Falta <b>CONFIG.'+esc(claveProy)+'</b> en la hoja CONFIG: no hay string Navision para el proyecto '+esc(proyecto)+'. Se usará "'+esc(proyecto)+'" tal cual, que Navision NO reconoce. Agrega esa fila y vuelve a descargar.</div>';
    } else if(proyectoCfg==='PENDIENTE'){
      msg.innerHTML='<div class="aviso">⚠️ El string de <b>CONFIG.'+esc(claveProy)+'</b> sigue como "PENDIENTE" (parámetro abierto). Se usará "'+esc(proyecto)+'" tal cual; ajusta CONFIG cuando llegue la plantilla de ese proyecto.</div>';
    }
    // Lee la plantilla y saca el catálogo de Trabajadores de SU PROPIA hoja "Trabajadores" (string exacto
    // de Navision, columna A). El mapa de la plantilla manda sobre lo que traiga el backend (que en la
    // práctica va vacío). Códigos que no estén (ingresos nuevos) caen al respaldo "codigo| NOMBRE".
    const wb=XLSX.read(STATE.tplBuf, {type:'array'});
    const catTrabajadores=Object.assign({}, data.catTrabajadores||{}, mapTrabajadoresDeWb(wb));
    const tipoJornada=tipoJornadaDeFecha(STATE.fecha, festivos);
    const avisosProyDefecto=[];
    // D101: los AUSENTES no llevan CC, así que su proyecto sale del histórico de su cuadrilla
    // (proyectoDefecto). El respaldo cuando esa cuadrilla no tiene histórico ya NO es "3701" fijo —eso
    // mandaba a los ausentes de UF3 (o de cualquier área futura) al Parte de tierras—: se usa el
    // proyecto mayoritario de las filas del propio día y, si tampoco hay, el que se está generando.
    const proyRespaldo=proyectoMayoritario(data.filas||[]) || proyecto;
    // Proyecto al que va una fila del Parte: el suyo si está presente; si está ausente no lleva CC, así
    // que sale del histórico de su cuadrilla (mismo criterio que usa `filasProyecto` abajo).
    const proyectoDeFila=function(f){
      if(f.presente==='Si') return String(f.proyecto||'');
      return data.proyectoDefecto[f.cuadrilla] || proyRespaldo;
    };
    const filasProyecto=(data.filas||[]).filter(f=>{
      if(f.presente!=='Si' && !data.proyectoDefecto[f.cuadrilla]) avisosProyDefecto.push(f.nombre);
      return proyectoDeFila(f)===proyecto;
    });
    /* D117 — última barrera antes de generar el archivo. El Parte lleva UNA línea por fila reportada, así
     * que una persona con dos filas ese día cobra DOBLE.
     *
     * D121 — la guarda se calcula sobre TODAS las filas del día, no sobre las de este proyecto. Antes se
     * agrupaba `filasProyecto`, que ya viene filtrado, y eso dejaba pasar justo el caso más engañoso: si
     * las dos filas de la persona tienen PROYECTO distinto (p. ej. la cuadrilla del capataz en 3701 y
     * OPERADORES en 3702), cada archivo la lleva UNA vez y el aviso no saltaba en ninguno de los dos —
     * revisando un solo Excel no se nota nada, pero entre los dos Partes se le pagan las horas dos veces.
     * Es exactamente lo que reportó el dueño (ago-2026): «el aviso lo marca duplicado pero no me aparece
     * en el Excel». Se agrupa además uniendo identificadores compartidos (D119), no por clave única. */
    const repetidas=agruparPorPersona(data.filas||[])
      .filter(function(g){ return g.length>1; })
      .filter(function(g){ return g.some(function(f){ return proyectoDeFila(f)===proyecto; }); });
    if(repetidas.length){
      const cruzadas=repetidas.filter(function(g){ return unicos(g.map(proyectoDeFila)).length>1; });
      const lista=repetidas.slice(0,12).map(function(g){
        return '  • '+(g[0].nombre||'(sin nombre)')+' — '+g.length+' filas: '
          + g.map(function(f){ return (f.cuadrilla||'?')+' / proy. '+(proyectoDeFila(f)||'?'); }).join('  |  ');
      }).join('\n')+(repetidas.length>12?`\n  …y ${repetidas.length-12} más`:'');
      const nota = cruzadas.length
        ? `\n\n⚠️ OJO: ${cruzadas.length} de ellas tienen sus filas en PROYECTOS DISTINTOS, así que salen UNA vez en cada archivo.\nRevisando un solo Excel no se nota, pero entre los dos Partes se le pagan las horas dos veces.`
        : '';
      if(!confirm(`⚠️ ${repetidas.length} persona(s) tienen MÁS DE UNA fila este día y alguna cae en el proyecto ${proyecto}:\n\n${lista}${nota}\n\nEl Parte lleva una línea por fila, así que sus horas quedarían REPETIDAS en Navision.\nLo correcto es dejar a cada persona en una sola cuadrilla y volver a enviar ese reporte.\n\n¿Descargar de todas formas?`)) { msg.innerHTML=''; return; }
    }
    // Gancho D73: extras del admin de este día×proyecto (canal aparte, no está en `filas`). Se inyectan
    // como filas extra del Parte. `admin_recurso` (CONFIG) es parámetro abierto: si viene vacío, no se
    // agrega la fila y se avisa. Dom/Fest del admin va a col D (tope 7h, D73); H–N sigue abierto.
    const adminRecurso=String(cfg.admin_recurso||'').trim();
    const extrasDia=(data.extrasAdmin||[]).filter(ex=>String(ex.proyecto||'')===proyecto);
    if(!filasProyecto.length && !(extrasDia.length && adminRecurso)){
      if(extrasDia.length && !adminRecurso){
        msg.innerHTML='<div class="aviso">⚠️ Tienes extras registradas para el proyecto '+esc(proyecto)+' este día, pero falta configurar <b>admin_recurso</b> en CONFIG para exportarlas.</div>';
        return;
      }
      msg.innerHTML='<div class="aviso">No hay filas para el proyecto '+esc(proyecto)+' en esta fecha.</div>';
      return;
    }
    let hayAvisoGN=false; const overExtra=[]; const sinCodigo=[]; const recorte10=[];
    const aoa=filasProyecto.map(f=>{
      const turnoRow=turnoRowFor(f.turno, STATE.fecha, turnos, tipoJornada);   // D72: jornada programada del reporte
      const row=buildParteRow(f, proyectoStr, cfg, tipoJornada, catTrabajadores, turnoRow);
      if(row._aviso) hayAvisoGN=true;
      if(row._avisoExtra) overExtra.push(row._nombre);
      if(row._recorte10>0.001) recorte10.push({nombre:row._nombre, horas:row._recorte10});   // extra quitada por el tope de 10h
      if(!String(f.codigo||'').trim()) sinCodigo.push(f.nombre);  // sin código Navision (col A queda "| NOMBRE")
      return row;
    });
    // Filas del admin (D73): una por extra del día para este proyecto.
    let avisoAdminSinRecurso=false; const adminDomFest=[]; let adminAgregadas=0;
    if(extrasDia.length){
      if(!adminRecurso){ avisoAdminSinRecurso=true; }
      else {
        extrasDia.forEach(ex=>{
          aoa.push(buildAdminExtraRow(ex, proyectoStr, adminRecurso, cfg));   // D120: cfg trae los topes dom/fest
          adminAgregadas++;
          if(ex.tipo==='domfest') adminDomFest.push(ex.fecha);
        });
      }
    }

    const wsName = wb.SheetNames.indexOf('Parte')>=0 ? 'Parte' : wb.SheetNames[0];
    const ws=wb.Sheets[wsName];
    // Limpia cualquier fila de datos previa de la hoja Parte (por si la plantilla trae filas de ejemplo):
    // borra toda celda con fila >= filaInicio, conserva la fila 1 (encabezados) y las demás hojas intactas.
    Object.keys(ws).forEach(k=>{
      if(k[0]==='!') return;
      const cell=XLSX.utils.decode_cell(k);
      if(cell.r >= STATE.filaInicio-1) delete ws[k];   // filaInicio es 1-based; decode_cell.r es 0-based
    });
    ws['!ref']='A1:R1';                                  // solo encabezados antes de escribir el día
    XLSX.utils.sheet_add_aoa(ws, aoa, {origin:'A'+STATE.filaInicio});
    const endRow=STATE.filaInicio+aoa.length-1;
    const range=XLSX.utils.decode_range(ws['!ref']);
    range.s.r=0; range.s.c=0;
    if(endRow-1 > range.e.r) range.e.r=endRow-1;
    if(range.e.c<17) range.e.c=17;                       // asegura A–R (18 columnas)
    ws['!ref']=XLSX.utils.encode_range(range);

    const nombre=`Parte_${proyecto}_${STATE.fecha}.xlsx`;
    XLSX.writeFile(wb, nombre);
    let out=`<div class="aviso" style="color:var(--success-txt);border-color:rgba(46,204,113,0.3);background:rgba(46,204,113,0.08);">✓ Generado <b>${esc(nombre)}</b> (${aoa.length} fila(s)).</div>`;
    if(adminAgregadas) out+='<div class="aviso" style="color:var(--success-txt);border-color:rgba(46,204,113,0.3);background:rgba(46,204,113,0.08);">✓ Incluida(s) '+adminAgregadas+' fila(s) de tus horas extra (admin) en este archivo.</div>';
    if(avisoAdminSinRecurso) out+='<div class="aviso">⚠️ Hay extras del admin para este proyecto pero <b>admin_recurso</b> está vacío en CONFIG: no se agregaron. Configúralo para exportarlas.</div>';
    if(adminDomFest.length) out+='<div class="aviso" style="color:var(--success-txt);border-color:rgba(46,204,113,0.3);background:rgba(46,204,113,0.08);">ℹ️ Extra del admin en domingo/festivo el <b>'+adminDomFest.map(esc).join(', ')+'</b>: se reportó en <b>D Horas ordinarias dom/fest</b> (tope 7h), no en extras.</div>';
    if(hayAvisoGN) out+='<div class="aviso">⚠️ Día domingo/festivo: alguien superó las 7h Dom/Fest + 2h de extras Dom/Fest (D81). El archivo registra 7h en la col D y máximo 2h en la col H; el excedente quedó por fuera — revísalo a mano.</div>';
    if(overExtra.length){ const mx=parseFloat(cfg.max_extras_dia)||2;
      out+='<div class="aviso">ℹ️ Estas personas trabajaron más de '+mx+' horas extra: <b>'+overExtra.map(esc).join(', ')+'</b>. El archivo reporta solo '+mx+' (el tope); el resto queda para que el residente lo sume a mano en los días que corresponda.</div>'; }
    if(recorte10.length){
      // Tope de 10 h/día del sistema externo (ver aplicarTope10). El archivo sube 10 h; el excedente hay
      // que sumarlo a mano en OTRO día del corte para no dejar de pagar esas horas extra.
      const items=recorte10.map(r=>esc(r.nombre)+' (falta '+fmtH(r.horas)+'h)').join(', ');
      const totHoras=fmtH(recorte10.reduce((a,r)=>a+r.horas,0));
      out+='<div class="aviso">⏱️ <b>Tope de 10 h/día</b> del sistema al subir: a estas personas se les recortó la extra para no pasar de 10 h en el día: <b>'+items+'</b>. '
        + 'El archivo sube 10 h; <b>faltan '+totHoras+'h</b> de extra que hay que sumar en <b>otro día</b> del corte para no dejar de pagarlas.</div>';
    }
    if(sinCodigo.length) out+='<div class="aviso">⚠️ Sin código Navision (la columna A queda incompleta "| NOMBRE"): <b>'+sinCodigo.map(esc).join(', ')+'</b>. Consigue su código en Navision/RRHH y ponlo en PERSONAL antes de importar.</div>';
    if(avisosProyDefecto.length) out+='<div class="aviso">⚠️ No se pudo determinar el proyecto habitual de: '+avisosProyDefecto.map(esc).join(', ')+'. Se incluyeron en 3701 por defecto — mover a mano si corresponde.</div>';
    msg.innerHTML=out;
  }catch(err){
    msg.innerHTML='<div class="aviso">⚠️ Error generando el Excel: '+esc(err.message||err)+'</div>';
  }
}

/* D99 — Refresca el caché de catálogos del backend (6 h) y recarga el día. Solo hace falta tras editar
 * el Sheet A MANO (CAT_CC, CAT_MOTIVOS, CC_USADOS, CONFIG, TURNOS, estado/área de CUADRILLAS): lo que
 * se cambia desde la app ya invalida su hoja sola. Si el Apps Script no está redesplegado, el endpoint
 * no existe y se avisa con la causa exacta en vez de fallar en silencio. */
async function refrescarCatalogos(btn){
  const msg=document.getElementById('cacheMsg');
  if(btn) btn.disabled=true;
  if(msg){ msg.textContent='⏳ Refrescando…'; msg.style.color='var(--muted)'; msg.style.fontWeight=''; }
  try{
    const data=await perfFetch('cache_reset', `${APPS_SCRIPT_URL}?action=cache_reset&usuario=${encodeURIComponent(STATE.usuario)}`);
    if(!data.ok) throw new Error(data.error||'cache_reset');
    if(!data.hojas) throw new Error('El Apps Script todavía no tiene el refresco de catálogos. Redespliega CodigoAsistencias.gs (editar implementación → versión nueva, misma URL).');
    if(msg) msg.textContent='✓ Catálogos releídos del Sheet.';
    STATE.exportCache={}; STATE.personal=null;
    cargarResumen();
  }catch(err){
    if(msg) msg.textContent='⚠️ '+(err.message||err);
  }finally{ if(btn) btn.disabled=false; }
}

/* ================= GESTIÓN DE PERSONAL (solo residente/admin) ================= */
async function cargarPersonal(){
  const body=document.getElementById('gestionBody');
  body.innerHTML='<p style="color:var(--muted);font-size:13px;">⏳ Cargando…</p>';
  try{
    perfReset();
    const data=await perfFetch('personal (gestión)',
      `${APPS_SCRIPT_URL}?action=personal&usuario=${encodeURIComponent(STATE.usuario)}&area=${encodeURIComponent(STATE.areaFiltro||'')}`);
    perfTabla('gestión de personal');
    if(!data.ok) throw new Error(data.error||'personal');
    STATE.personal=data;
    renderPersonal();
  }catch(err){
    body.innerHTML='<p style="color:var(--error-txt);font-size:13px;">⚠️ '+esc(err.message||err)+'</p>';
  }
}
function renderPersonal(){
  const body=document.getElementById('gestionBody'); if(!body) return;
  const d=STATE.personal, cuadrillas=d.cuadrillas.map(c=>c.cuadrilla);
  let h='<div class="section-title" style="margin:6px 0;">Agregar persona</div>';
  const hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  h+='<div class="row">'
    + '<div class="field"><label>Código</label><input type="text" id="altaCodigo"></div>'
    + '<div class="field"><label>Nombre</label><input type="text" id="altaNombre"></div>'
    + '<div class="field"><label>Cargo</label><input type="text" id="altaCargo"></div>'
    + '<div class="field"><label>Cuadrilla</label><select id="altaCuadrilla">'+cuadrillas.map(c=>`<option>${esc(c)}</option>`).join('')+'</select></div>'
    + '<div class="field"><label>Cédula (opcional)</label><input type="text" id="altaCedula"></div>'
    // D72: ingreso retroactivo — si al residente se le pasó alguien, lo agrega "desde cierto día" y
    // aparece correctamente en los días ya pasados (y no antes). Por defecto, hoy.
    + `<div class="field" style="max-width:150px;"><label>Ingreso desde</label><input type="date" id="altaIngreso" value="${hoy}"></div>`
    + '<div class="field" style="flex:0;"><button class="btn" onclick="altaPersona()">Agregar</button></div>'
    + '</div>';

  h+='<div class="section-title" style="margin:18px 0 6px;">Personal</div>';
  // Filtro: normalmente solo se busca 1-2 personas para mover/retirar/reactivar. El input queda FUERA
  // del contenedor que se reconstruye (persTablaWrap) para no perder el foco al escribir.
  h+=`<input type="text" id="persFiltro" placeholder="Filtrar por nombre, código o cuadrilla…" value="${esc(STATE.persQuery)}" oninput="filtrarPersonal(this.value)" style="margin-bottom:10px;">`;
  h+='<div id="persTablaWrap"></div>';
  body.innerHTML=h;
  renderPersonalTabla();
}
function filtrarPersonal(v){ STATE.persQuery=v; renderPersonalTabla(); }
function renderPersonalTabla(){
  const wrap=document.getElementById('persTablaWrap'); if(!wrap) return;
  const d=STATE.personal, cuadrillas=d.cuadrillas.map(c=>c.cuadrilla);
  const q=(STATE.persQuery||'').trim().toLowerCase();
  const lista=!q ? d.personal : d.personal.filter(p=>
    (String(p.nombre||'')+' '+String(p.codigo||'')+' '+String(p.cuadrilla||'')+' '+String(p.cargo||'')).toLowerCase().indexOf(q)>=0);
  let h=`<p style="font-size:11px;color:var(--muted);margin-bottom:6px;">${lista.length} de ${d.personal.length} persona(s)</p>`;
  h+='<div style="overflow-x:auto;"><table><thead><tr><th>Nombre</th><th>Código</th><th>Cuadrilla</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>';
  lista.forEach(p=>{
    h+=`<tr><td>${esc(p.nombre)}<br><small style="color:var(--muted)">${esc(p.cargo)}</small></td><td>${esc(p.codigo)}</td>`
      + `<td><select onchange="moverPersona(${p._row},this.value)">`+cuadrillas.map(c=>`<option ${c===p.cuadrilla?'selected':''}>${esc(c)}</option>`).join('')+'</select></td>'
      + `<td><span class="tag ${p.estado==='activo'?'activo':'inactivo'}">${esc(p.estado)}</span></td>`
      + '<td>' + (p.estado==='activo'
          ? `<button class="mini-btn" onclick="retirarPersona(${p._row})">Retirar</button>`
          : `<button class="mini-btn" title="Deshacer un retiro por error (misma fila, sin hueco)" onclick="reactivarPersona(${p._row})">Reactivar</button>`
            + `<button class="mini-btn" title="Volvió tras un tiempo fuera: crea fila nueva desde una fecha, respeta los días inactivos" onclick="reingresarPersona(${p._row})">Reingresar</button>`)
        + '</td></tr>';
  });
  if(!lista.length) h+='<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:14px;">Sin coincidencias</td></tr>';
  h+='</tbody></table></div>';
  wrap.innerHTML=h;
}
// (POST de gestión de personal — mismo contrato de siempre, ahora cronometrado con DEBUG_PERF.)
async function postPersonal(payload){
  payload.action='personal'; payload.usuario=STATE.usuario;
  perfReset();
  const data=await perfFetch('personal ('+(payload.op||'op')+')', APPS_SCRIPT_URL,
    { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) });
  perfTabla('gestión de personal · '+(payload.op||''));
  return data;
}
/* D154 — Las cinco acciones de gestión de personal recargaban la lista y no decían
 * NADA. Como el formulario se limpia solo al repintar, el resultado era idéntico a
 * no haber hecho nada: reportado en obra («el botón de agregar no funciona»), cuando
 * en realidad sí había guardado. Se reutiliza `#cacheMsg` —la línea de estado que ya
 * tiene la tarjeta de gestión— porque vive FUERA de `#gestionBody`, que es lo único
 * que repinta `cargarPersonal()`; un aviso puesto dentro se borraría solo. */
function avisoPersonal(txt, ok){
  const msg=document.getElementById('cacheMsg');
  if(!msg) return;
  msg.textContent=txt;
  msg.style.color = ok===false ? 'var(--error-txt)' : 'var(--success-txt)';
  msg.style.fontWeight='600';
  clearTimeout(avisoPersonal._t);
  avisoPersonal._t=setTimeout(()=>{
    if(msg.textContent!==txt) return;        // ya lo pisó otro aviso: no tocar
    msg.textContent=''; msg.style.color='var(--muted)'; msg.style.fontWeight='';
  }, 8000);
}
// Nombre de una persona por su fila, para que el aviso diga a quién afectó.
function nombrePorFila(row){
  const l=((STATE.personal||{}).personal)||[];
  const p=l.find(x=>String(x._row)===String(row));
  return p&&p.nombre ? p.nombre : 'la persona';
}
async function altaPersona(){
  const codigo=document.getElementById('altaCodigo').value.trim();
  const nombre=document.getElementById('altaNombre').value.trim();
  const cargo=document.getElementById('altaCargo').value.trim();
  const cuadrilla=document.getElementById('altaCuadrilla').value;
  const cedula=document.getElementById('altaCedula').value.trim();
  const fecha_ingreso=document.getElementById('altaIngreso').value;
  if(!nombre || !cuadrilla){ alert('Nombre y cuadrilla son obligatorios.'); return; }
  const r=await postPersonal({op:'alta', codigo, nombre, cargo, cuadrilla, cedula, fecha_ingreso});
  if(r.ok){ avisoPersonal('\u2713 '+nombre+' agregada a '+cuadrilla+'.'); cargarPersonal(); }
  else alert('Error: '+(r.error||'desconocido'));
}
async function retirarPersona(row){
  // D72: el retiro lleva la fecha efectiva que elige el residente. Es el PRIMER día NO trabajado:
  // la persona sigue apareciendo reportable hasta el día anterior (y en días pasados no cambia nada).
  const hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  const fecha_retiro=prompt('Retirar desde qué fecha (primer día que YA NO trabaja)?\nFormato AAAA-MM-DD:', hoy);
  if(fecha_retiro===null) return;                       // canceló
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha_retiro)){ alert('Fecha inválida. Usa el formato AAAA-MM-DD.'); return; }
  const nom=nombrePorFila(row);
  const r=await postPersonal({op:'retiro', _row:row, fecha_retiro});
  if(r.ok){ avisoPersonal('\u2713 '+nom+' retirada desde '+fecha_retiro+'.'); cargarPersonal(); }
  else alert('Error: '+(r.error||'desconocido'));
}
async function reactivarPersona(row){
  const nom=nombrePorFila(row);
  const r=await postPersonal({op:'reactivar', _row:row});
  if(r.ok){ avisoPersonal('\u2713 '+nom+' reactivada.'); cargarPersonal(); }
  else alert('Error: '+(r.error||'desconocido'));
}
async function reingresarPersona(row){
  // D72: crea una fila NUEVA con los datos de la persona (sin re-digitar) desde la fecha de reingreso;
  // la fila retirada queda intacta, así los días del hueco no se le esperan.
  const hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  const fecha_ingreso=prompt('¿Desde qué fecha reingresa? (primer día que vuelve a trabajar)\nFormato AAAA-MM-DD:', hoy);
  if(fecha_ingreso===null) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha_ingreso)){ alert('Fecha inválida. Usa el formato AAAA-MM-DD.'); return; }
  const nom=nombrePorFila(row);
  const r=await postPersonal({op:'reingreso', _row:row, fecha_ingreso});
  if(r.ok){ avisoPersonal('\u2713 '+nom+' reingresa desde '+fecha_ingreso+'.'); cargarPersonal(); }
  else alert('Error: '+(r.error||'desconocido'));
}
async function moverPersona(row, cuadrilla){
  const nom=nombrePorFila(row);
  const r=await postPersonal({op:'mover', _row:row, cuadrilla});
  if(r.ok){ avisoPersonal('\u2713 '+nom+' movida a '+cuadrilla+'.'); cargarPersonal(); }
  else alert('Error: '+(r.error||'desconocido'));
}
</script>
