<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- CSP: esta pantalla además carga SheetJS desde un CDN para generar el Excel; por eso su
     script-src lleva ese host de más respecto de las otras pantallas (ver docs/PROJECT_CONTEXT.md). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de Asistencias — Residente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<!-- SheetJS (generador del Parte Navision): se carga BAJO DEMANDA, no aquí. Etiquetada en la cabecera
     bloqueaba el primer pintado con ~900 KB que solo hacen falta al pulsar "Excel 3701/3702" (ver
     ensureXLSX()). Misma librería y misma versión: no es una dependencia nueva. -->
<link rel="stylesheet" href="tema.css">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<script src="tema.js"></script>
<link rel="stylesheet" href="resumen-asistencia.css">
</head>
<body>
<div class="loadbar" id="loadBar"></div>
<div class="header">
  <span class="galca-simbolo" role="img" aria-label="Galca"></span>
  <div class="header-left">
    <div class="label">Asistencias</div>
    <h1>📋 Resumen de Asistencias</h1>
  </div>
  <div class="header-user">
    <span id="userDisplay">—</span>
    <!-- D112: entrada a "Horas por persona" (horas-persona.html). Es la vista INVERSA de esta pantalla
         (una persona × un período, en vez de un día × todas las cuadrillas) y la usa la misma gente,
         así que se entra desde aquí. Mismo guard y mismo filtro por área. -->
    <a class="logout-btn btn-volver" href="horas-persona.html" title="Horas de una persona en un período (para revisar un reclamo de pago)" data-estilo="display:inline-block;text-decoration:none;">🕐 Horas por persona</a>
    <button class="logout-btn btn-volver" id="btnBack" data-estilo="display:none;">← Volver</button>
    <button class="logout-btn" data-on-click="logout()">Salir</button>
  </div>
</div>
<!-- D133 — la barra de consulta vive FUERA de #container: el contenedor lo reconstruye `render()` con
     cada respuesta, y la barra tiene que estar en pantalla antes de que haya ninguna (y seguir estando
     si la consulta falla). Antes el campo de fecha se pintaba dentro del resumen, así que para cambiar
     de día había que esperar primero a que cargara el día que no querías ver. -->
<div class="u-pb0 container" id="barraConsulta"></div>
<div class="container" id="container">
  <div class="loading">⏳ Cargando…</div>
</div>

<!-- D112 — Clasificador de horas COMPARTIDO con `horas-persona.html` (clasificarHoras, turnoRowFor,
     tipoJornadaDeFecha, jornadaPorDefecto, horasNum, ovlp, round2). Estaba en línea en este archivo;
     se extrajo sin cambiar la lógica para que la pantalla de reclamos de pago dé los mismos números
     que el Parte de Navision. Tiene que ir ANTES del script de la página. -->
<script src="horas-nomina.js"></script>
<script src="resumen-asistencia.js"></script>
</body>
</html>
