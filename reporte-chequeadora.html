<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Chequeadora</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5a623">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TM2 Sur">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<script src="offline.js"></script>
<script src="flota.js"></script>
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<link rel="stylesheet" href="reporte-chequeadora.css">
</head>
<body>
<div class="header">
  <span class="galca-simbolo" role="img" aria-label="Galca"></span>
  <div class="header-left">
    <div class="label">Reporte Diario · Chequeadora</div>
    <h1>🚛 Viajes del día</h1>
  </div>
  <div class="header-user">
    <span id="userDisplay">—</span>
    <button class="logout-btn btn-volver" id="btnMenu" data-on-click="irA('menu.html')" data-estilo="display:none;">← Menú</button>
    <button class="logout-btn" data-on-click="logout()">Salir</button>
  </div>
</div>

<div id="formMain">
<div class="container">
  <div class="card">
    <div class="field"><label>Fecha <span class="req">*</span></label><input type="date" id="fecha"></div>
    <div class="field">
      <label>Origen del material <span class="req">*</span></label>
      <select id="origen" data-on-change="onOrigen()">
        <option value="">— Selecciona origen —</option>
        <option value="Masivo2">Masivo 2 (PK 19)</option>
        <option value="Masivo1">Masivo 1 (PK 14)</option>
        <option value="Diviso">Diviso / Préstamo</option>
        <option value="Complementario">PK Complementario</option>
        <option value="Otro">Otro origen</option>
      </select>
    <div class="field" id="origenTextoWrap" data-estilo="display:none;">
      <label>PK del origen (donde se hizo el corte)</label>
      <input type="text" id="origenTexto" placeholder="ej. 22+100">
    </div>
  </div>

  <div class="card">
    <div class="section-title">Viajes por PK destino <span class="count" id="cnt">0</span></div>
    <div id="lineasContainer"></div>
    <div class="empty-hint" id="empty">Agrega los viajes por cada PK</div>
    <button class="btn-add" data-on-click="addLinea()">+ Agregar PK</button>
    <div class="resumen" id="resumen" data-estilo="display:none;">
      <span>Total: <b id="totViajes">0</b> viajes</span>
      <span><b id="totM3">0</b> m³</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Maquinaria (excavadoras) <span class="count" id="cntMaq">0</span></div>
    <div id="maqContainer"></div>
    <div class="empty-hint" id="emptyMaq">Agrega las excavadoras que estuvieron a disposición (opcional)</div>
    <button class="btn-add" data-on-click="addMaquina()">+ Agregar máquina</button>
    <div class="bloque-hint" id="maqProdHint" data-estilo="display:none;"></div>
  </div>
</div>
</div>
</div>

<div class="success" id="successScreen">
  <div class="ico" id="successIco">✅</div>
  <h2 id="successTitle">Reporte enviado</h2>
  <p id="successMsg">Tus viajes quedaron registrados.</p>
  <button data-on-click="resetForm()">Nuevo reporte</button>
</div>

<div class="submit-bar" id="submitBar">
  <div class="submit-inner">
    <button class="btn-submit" id="btnSubmit" data-on-click="submitForm()">ENVIAR VIAJES DEL DÍA →</button>
  </div>
</div>

<script src="reporte-chequeadora.js"></script>
</body>
</html>
