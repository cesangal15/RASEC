<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Jefe — Consulta de Obra</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<script src="tema.js"></script>
<link rel="stylesheet" href="jefe.css">
</head>
<body>
<div class="header">
  <span class="galca-simbolo" role="img" aria-label="Galca"></span>
  <div class="header-left">
    <div class="label">Consulta · Jefe</div>
    <h1>📊 Panel del Jefe</h1>
  </div>
  <div class="header-user">
    <span id="userDisplay">—</span>
    <button class="logout-btn btn-volver" id="btnMenu" data-on-click="irA('menu.html')" data-estilo="display:none;">← Menú</button>
    <button class="logout-btn" data-on-click="logout()">Salir</button>
  </div>
</div>

<div class="container">
  <div class="filtro-card">
    <div class="filtro-row">
      <div class="field"><label>Desde</label><input type="date" id="desde" data-on-change="syncRango()"></div>
      <div class="field"><label>Hasta</label><input type="date" id="hasta"></div>
      <button class="btn-consultar" data-on-click="consultar()">CONSULTAR →</button>
    </div>
    <div class="filtros-din" id="filtrosDin">
      <div class="filtro-row">
        <div class="field"><label>Área</label><select id="fArea" data-on-change="render()">
          <option value="">Todas</option>
          <option value="tierras">Tierras</option>
          <!-- D131: ODT y ODL juntos. El residente de drenajes lleva LOS DOS capítulos (D84) y hasta
               ahora tenía que mirarlos por separado o irse a "Todas", que le mete tierras encima. -->
          <option value="drenajes">Drenajes (ODT + ODL)</option>
          <option value="odt">ODT (drenaje transversal)</option>
          <option value="odl">ODL (drenaje longitudinal)</option>
        </select></div>
        <div class="field"><label>Actividad</label><select id="fActividad" data-on-change="render()"></select></div>
        <div class="field"><label>Unidad Funcional</label><select id="fUf" data-on-change="render()"></select></div>
      </div>
    </div>
  </div>
  <div id="resultados">
    <div class="empty-state"><div class="icon">🗓️</div><p>Elige un rango de fechas y consulta el resumen de obra.</p></div>
  </div>

  <!-- D158: el TABLERO DE PRODUCCIÓN ocupa el lugar que tenía Maquinaria.
       Maquinaria sale de aquí (ver D158 abajo): es una pantalla de captura, no
       de consulta, y sigue estando donde le sirve a quien la usa — el panel del
       residente de tierras y el menú del admin. -->
  <a class="tile-link" id="tileTablero" href="tablero-produccion.html">
    <div class="ico">📊</div>
    <div><h2>Tablero de Producción (mensual)</h2><p>Velocidad contra meta, rendimiento de maquinaria, avance del contrato y clima. Es lo que reemplaza la hoja <code>GRAFICOS</code> de la presentación mensual</p></div>
    <div class="arrow">→</div>
  </a>
</div>

<script src="jefe.js"></script>
</body>
</html>
