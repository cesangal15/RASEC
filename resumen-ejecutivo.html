<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- CSP D167/D170: la MISMA de las demás pantallas (crear_pantalla.js la copia de una pantalla real). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen ejecutivo — TM2 Sur</title>
<meta name="theme-color" content="#f5a623">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<link rel="stylesheet" href="resumen-ejecutivo.css">
</head>
<body>
<div class="header">
  <span class="galca-simbolo" role="img" aria-label="Galca"></span>
  <div class="header-left">
    <div class="label">Obra · Jefe</div>
    <h1>Resumen ejecutivo</h1>
  </div>
  <div class="header-user">
    <span id="userDisplay">—</span>
    <button class="logout-btn btn-volver" id="btnMenu" data-on-click="volver()" data-estilo="display:none;">← Menú</button>
    <button class="logout-btn" data-on-click="logout()">Salir</button>
  </div>
</div>

<div class="container" id="container">
  <div class="filtro-card">
    <div class="filtro-row">
      <div class="field"><label>Desde</label><input type="date" id="desde" data-on-change="syncRango()"></div>
      <div class="field"><label>Hasta</label><input type="date" id="hasta"></div>
      <button class="btn" data-on-click="generar()">Generar →</button>
    </div>
    <div class="chips-row">
      <button type="button" class="chip" data-on-click="rangoUltimos7()">Últimos 7 días</button>
      <button type="button" class="chip" data-on-click="rangoPeriodoActual()">Periodo actual</button>
      <button type="button" class="chip" data-on-click="rangoPeriodoAnterior()">Periodo anterior</button>
    </div>
  </div>

  <!-- Versión PC (D151): en móvil los envoltorios desaparecen (display:contents) y todo se apila igual. -->
  <div class="pc-zona">
    <div class="pc-a">
      <div class="acciones-row">
        <button class="btn-sec" id="btnCopiar" data-on-click="copiarTexto()" disabled>📋 Copiar</button>
      </div>
      <div id="zonaTexto"><div class="empty-state"><div class="icon">🗓️</div><p>Elige un rango y pulsa «Generar».</p></div></div>
    </div>
    <div class="pc-b" id="zonaIndicadores"></div>
  </div>
</div>

<script src="resumen-ejecutivo.js"></script>
</body>
</html>
