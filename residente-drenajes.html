<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Drenajes — Residente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<script src="tema.js"></script>
<link rel="stylesheet" href="residente-drenajes.css">
</head>
<body>
<div class="header">
  <span class="galca-simbolo" role="img" aria-label="Galca"></span>
  <div class="header-left">
    <div class="label" id="hdrLabel">Bandeja · Drenajes</div>
    <h1 id="hdrTitle">🚧 Panel de Drenajes</h1>
  </div>
  <div class="header-user">
    <span id="userDisplay">—</span>
    <button class="logout-btn btn-volver" id="btnMenu" data-on-click="irA('menu.html')" data-estilo="display:none;">← Menú</button>
    <!-- D131: acceso al resumen post-DATA (jefe.html). Solo lectura; llega con el filtro en ODT+ODL. -->
    <button class="logout-btn btn-volver" id="btnResumen" data-on-click="irA('jefe.html')" data-estilo="display:none;">📊 Resumen</button>
    <button class="logout-btn" data-on-click="logout()">Salir</button>
  </div>
</div>

<div class="container">
  <div class="filtro-card">
    <div class="filtro-row">
      <div class="field"><label>Fecha</label><input type="date" id="fecha"></div>
      <div class="field" id="areaField" data-estilo="max-width:150px;display:none;"><label>Área (admin)</label>
        <select id="areaSel" data-on-change="cambiarArea()"><option value="odt">ODT</option><option value="odl">ODL</option></select>
      </div>
      <button class="btn-consultar" data-on-click="consultar()">CONSULTAR →</button>
    </div>
  </div>
  <div id="resultados">
    <div class="empty-state"><div class="icon">🗓️</div><p>Selecciona una fecha y revisa la bandeja de tu área</p></div>
  </div>
</div>

<script src="residente-drenajes.js"></script>
</body>
</html>
