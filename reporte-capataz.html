<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Diario de Obra — Capataz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5a623">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TM2 Sur">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<script src="offline.js"></script>
<script src="flota.js"></script>
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<link rel="stylesheet" href="reporte-capataz.css">
</head>
<body>
<div class="header">
  <span class="galca-simbolo" role="img" aria-label="Galca"></span>
  <div class="header-left">
    <div class="label">Reporte Diario · Capataz</div>
    <h1>📋 Reporte de Obra</h1>
  </div>
  <div class="header-user">
    <span id="userDisplay">—</span>
    <button class="logout-btn btn-volver" id="btnMenu" data-on-click="irA('menu.html')" data-estilo="display:none;">← Menú</button>
    <button class="logout-btn" id="backBtn" data-on-click="logout()">Salir</button>
  </div>
</div>

<div id="formMain">
<div class="container">
  <div class="card">
    <div class="field">
      <label>Fecha del reporte <span class="req">*</span></label>
      <input type="date" id="fechaReporte">
      <!-- D138: solo aparece si la lista de máquinas NO salió del servidor (sin señal o hoja vacía). -->
      <div id="avisoFlota" data-estilo="display:none;margin-top:8px;font-size:12px;color:#f5a623;line-height:1.5;"></div>
    </div>
  </div>
  <div class="card">
    <div class="section-title">Actividades del día <span class="count" id="cntCantidades">0</span></div>
    <div id="cantidadesContainer"></div>
    <div class="empty-hint" id="cantEmpty">Agrega las actividades ejecutadas hoy</div>
    <button class="btn-add" data-on-click="addLinea()">+ Agregar actividad</button>
  </div>
  <div class="card" id="obsCard">
    <div class="section-title">Observaciones generales</div>
    <div class="u-m0 field">
      <label>Observación del día <span class="opt">(opcional)</span></label>
      <textarea id="obsGeneral" rows="3" placeholder="ej. Paró la lluvia a las 14h, se suspendieron trabajos en el frente norte" class="u-textarea"></textarea>
    </div>
  </div>
  <div class="resumen-card" id="resumenCard" data-estilo="display:none;">
    <div class="section-title">Resumen a enviar</div>
    <div id="resumenBody"></div>
  </div>
</div>
</div>

<div class="success" id="successScreen">
  <div class="ico" id="successIco">✅</div>
  <h2 id="successTitle">Reporte enviado</h2>
  <p id="successMsg">Tu reporte del día quedó registrado.</p>
  <button data-on-click="resetForm()">Nuevo reporte</button>
</div>

<div class="submit-bar" id="submitBar">
  <div class="submit-inner">
    <button class="btn-submit" id="btnSubmit" data-on-click="submitForm()">ENVIAR REPORTE DEL DÍA →</button>
  </div>
</div>

<script src="reporte-capataz.js"></script>
</body>
</html>
