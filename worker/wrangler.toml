# TM2 Sur — Cloudflare Worker «galca-api» (D169)
#
# Proxy ÚNICO delante de los Apps Script de obra, asistencias y parte, en https://api.galca.app.
# Las URLs /exec de Google NO van aquí ni en src/index.js: son SECRETOS del Worker
# (`wrangler secret put …`, ver docs/OPERACIONES.md §7). Este archivo se puede publicar tranquilo.
#
#   Ruta            Secreto                   Filtro
#   /obra           OBRA_URL                  token de D109 obligatorio (salvo action=login y action=tablero)
#   /asistencias    ASISTENCIAS_URL           token de D109 obligatorio
#   /parte          PARTE_URL                 sin token (formulario público por QR, D165)
#   /prueba/<x>     <X>_PRUEBA_URL            mismo filtro que su ruta; opcional (entorno de prueba, D168)
#   Cualquier ruta con BACKEND_<MODULO>[_PRUEBA]=db no reenvía: la atiende src/api/<modulo>.js contra Postgres (4.01)
#
# Desplegar:   wrangler login · wrangler secret put OBRA_URL (×3) · wrangler deploy
# Ruta:        el dominio personalizado de abajo crea solo el registro DNS de api.galca.app
#              (la zona galca.app tiene que estar en la misma cuenta de Cloudflare).

#
# 4.01 (D180): cada módulo puede correr en el Worker contra Postgres (Supabase) en vez de en su Apps Script.
#   Vars   BACKEND_PARTE / BACKEND_PARTE_PRUEBA               = sheets | db   (Fase 2, en producción)
#          BACKEND_OBRA / BACKEND_OBRA_PRUEBA                 = sheets | db   (Fase 4)
#          BACKEND_ASISTENCIAS / BACKEND_ASISTENCIAS_PRUEBA   = sheets | db   (Fase 3)
#          (conmutadores por ruta, abajo en [vars]; desde el 16-sep-2026 los tres en "db")
#   Secretos (wrangler secret put): DATABASE_URL (o el binding Hyperdrive de abajo), AUTH_SECRETO
#            (= mostrarSecretoAuth() del Apps Script de obra: el MISMO en los tres Apps Script y aquí, así los
#            tokens D109 son intercambiables y, con obra en db, el Worker los EMITE en el login) y, si prueba
#            tiene los suyos, DATABASE_URL_PRUEBA / AUTH_SECRETO_PRUEBA. Ninguno va en este archivo ni en el repo.
#   Esquema:  worker/sql/001_esquema.sql + 002_fases_3_4.sql.  Backfill: worker/sql/backfill_parte.js,
#             backfill_obra.js, backfill_asistencias.js (carga inicial; desde 4.01 los catálogos se editan en Supabase).

name = "galca-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]   # postgres.js (src/db.js) necesita net/tls de Node
workers_dev = false

# Dominio personalizado: Cloudflare crea el DNS y el certificado; no hace falta tocar la zona a mano.
routes = [
  { pattern = "api.galca.app", custom_domain = true }
]

[vars]
# Orígenes con permiso de CORS. Coma-separados. localhost/127.0.0.1 (cualquier puerto) se aceptan
# siempre para el banco de pruebas, además de lo que se liste aquí.
ALLOWED_ORIGINS = "https://tm2.galca.app"
# Límite por IP: peticiones por minuto. Debe coincidir con `simple.limit` del binding de abajo
# (ese es el que manda cuando existe; esta var alimenta el respaldo en memoria).
RATE_LIMIT_POR_MIN = "120"
# 4.01 — Backend del Parte Digital por ruta: "sheets" (reenvío al Apps Script, como siempre) o "db"
# (src/api/parte.js contra Postgres). Producción sigue en Sheets hasta el corte de la Fase 2; el
# entorno de prueba (/prueba/parte, ?env=prueba) ya apunta a la BD. Vuelta atrás = "sheets" + deploy.
BACKEND_PARTE = "db"
BACKEND_PARTE_PRUEBA = "db"
# 4.01 · Fases 3 y 4 — Obra y Asistencias por ruta, mismo conmutador (decisión 11). CORTE HECHO el
# 16-sep-2026: producción en "db" (Supabase); con obra en "db" el login lo hace el Worker (src/auth.js).
# Vuelta atrás = "sheets" + `wrangler deploy` (lo escrito en la BD entre tanto no estará en los Sheets).
BACKEND_OBRA = "db"
BACKEND_OBRA_PRUEBA = "db"
BACKEND_ASISTENCIAS = "db"
BACKEND_ASISTENCIAS_PRUEBA = "db"
# Versión del token (D109): la MISMA que la propiedad AUTH_V de los Apps Script (los tokens se verifican y,
# con obra en db, se emiten aquí con el mismo par AUTH_SECRETO/AUTH_V; subirla saca a todos).
AUTH_V = "1"

# Hyperdrive (pool de conexiones a Supabase). Crear UNA vez con la cadena de conexión del proyecto
# galca-tm2sur (Supabase → Connect → Session pooler, puerto 5432, IPv4):
#   npx wrangler hyperdrive create galca-tm2sur --connection-string="postgres://postgres.<ref>:<clave>@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
# y pegar aquí el id que devuelve. Mientras no exista, src/db.js usa el secreto DATABASE_URL.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fe977e189b484b6a97dce50edb0c4d63"

# Placement (D201): correr el Worker junto a la base (Supabase galca-tm2sur está en AWS us-east-1). Una petición
# del Parte hace ~10 consultas SEGUIDAS; sin esto cada una cruzaba desde el nodo del usuario (MIA ~60 ms, y EZE
# —Buenos Aires, ~1 de cada 4 peticiones desde Colombia— mucho más): _ms 600 ms en MIA y 2.500 ms en EZE.
# Vuelta atrás: borrar este bloque y `npx wrangler deploy`.
[placement]
region = "aws:us-east-1"

# Rate limit por IP (120/min). Binding nativo de Cloudflare: cuenta entre TODOS los nodos de la red.
# `namespace_id` es un entero cualquiera, único dentro de la cuenta. `period` solo admite 10 o 60.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[observability]
enabled = true

# Workers AI (plan Free, con cupo diario): redacción opcional del Resumen ejecutivo con IA
# (worker/src/api/obra/resumen_ejecutivo.js, action=resumen_ejecutivo_ia). Sin este binding, o si se agota
# el cupo, el endpoint cae automáticamente al texto redactado por reglas (gratis, determinista).
[ai]
binding = "AI"
