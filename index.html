<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Reporte de Obra — Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5a623">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TM2 Sur">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&family=Red+Hat+Display:wght@900&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<script src="offline.js"></script>
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="escena escena-movil" aria-hidden="true">
  <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" class="u-escena">
    <defs>
      <linearGradient id="cieloA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--esc-cielo-1)"/>
        <stop offset="12%" stop-color="var(--esc-cielo-2)"/>
        <stop offset="22%" stop-color="var(--esc-cielo-3)"/>
        <stop offset="100%" stop-color="var(--esc-cielo-4)"/>
      </linearGradient>
      <radialGradient id="brilloA" cx="0.7" cy="0.15" r="0.44">
        <stop offset="0%" stop-color="#f5a623" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="390" height="844" fill="url(#cieloA)"/>
    <rect x="0" y="0" width="390" height="844" fill="url(#brilloA)"/>
    <path d="M0,168 L92,150 L172,162 L252,140 L330,156 L390,146 L390,214 L0,214 Z" fill="var(--esc-cresta)"/>
    <path d="M0,214 L120,196 L240,212 L390,192 L390,470 L0,470 Z" fill="var(--esc-banda-1)"/>
    <path d="M0,470 L150,450 L300,468 L390,454 L390,700 L0,700 Z" fill="var(--esc-banda-2)"/>
    <path d="M0,700 L390,678 L390,844 L0,844 Z" fill="var(--esc-frente)"/>
    <g fill="var(--esc-maquina)" transform="translate(0,-57)">
      <rect x="248" y="188" width="48" height="9" rx="4.5"/>
      <rect x="256" y="173" width="28" height="15" rx="2"/>
      <rect x="258" y="164" width="13" height="10" rx="1.5"/>
      <polygon points="282,176 304,154 309,159 287,181"/>
      <polygon points="304,154 312,172 307,174 299,157"/>
      <path d="M310,170 L320,174 L316,182 L306,177 Z"/>
    </g>
  </svg>
</div>
<div class="escena escena-ancha" aria-hidden="true">
  <svg viewBox="0 0 704 800" preserveAspectRatio="xMidYMid slice" class="u-escena">
      <defs>
        <linearGradient id="cieloC" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--esc-cielo-1)"/>
          <stop offset="58%" stop-color="var(--esc-cielo-2)"/>
          <stop offset="100%" stop-color="var(--esc-cielo-3)"/>
        </linearGradient>
        <radialGradient id="brilloC" cx="0.68" cy="0.5" r="0.45">
          <stop offset="0%" stop-color="#f5a623" stop-opacity="0.24"/>
          <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="704" height="800" fill="url(#cieloC)"/>
      <rect x="0" y="0" width="704" height="800" fill="url(#brilloC)"/>
      <path d="M0,404 L160,384 L306,398 L452,376 L596,392 L704,380 L704,446 L0,446 Z" fill="var(--esc-cresta)"/>
      <path d="M0,446 L216,424 L432,442 L704,420 L704,540 L0,540 Z" fill="var(--esc-banda-1)"/>
      <path d="M0,540 L270,516 L540,536 L704,520 L704,664 L0,664 Z" fill="var(--esc-banda-2)"/>
      <path d="M0,664 L704,640 L704,800 L0,800 Z" fill="var(--esc-frente)"/>
      <g fill="var(--esc-maquina)">
        <rect x="452" y="426" width="66" height="12" rx="6"/>
        <rect x="463" y="405" width="38" height="21" rx="3"/>
        <rect x="466" y="393" width="18" height="13" rx="2"/>
        <polygon points="500,409 530,379 537,386 507,416"/>
        <polygon points="530,379 541,404 534,407 523,383"/>
        <path d="M538,401 L552,407 L547,418 L533,410 Z"/>
      </g>
    </svg>
</div>
<div class="velo" aria-hidden="true"></div>
<div class="marca">
  <div class="m-galca"><svg class="galca" viewBox="0 0 100 100" aria-hidden="true"><path d="M63 20.56A34 34 0 1 0 80 50L98 50" fill="none" stroke="currentColor" stroke-width="15"/><polygon points="74,24 96,24 85,42.5" fill="currentColor"/></svg><span>Galca</span></div>
  <div class="m-sello">TM2 Sur</div>
  <h2>Reporte de Obra</h2>
  <p>Partes diarios, asistencia y maquinaria &mdash; con se&ntilde;al o sin ella.</p>
</div>
<div class="panel">
<div class="card">
  <div class="panel-titulo">
    <h2>Entrar</h2>
    <p>Ingresa tus credenciales para continuar</p>
  </div>
  <div class="logo">
    <svg class="galca" viewBox="0 0 100 100" aria-hidden="true"><path d="M63 20.56A34 34 0 1 0 80 50L98 50" fill="none" stroke="currentColor" stroke-width="15"/><polygon points="74,24 96,24 85,42.5" fill="currentColor"/></svg>
    <div class="galca-nombre">Galca</div>
    <h1>Reporte de Obra</h1>
    <p>Ingresa tus credenciales para continuar</p>
  </div>
  <!-- D108: si ya hay sesión en este teléfono se ofrece continuar sin teclear nada. Es lo que hace
       que el login del backend no rompa el modo sin conexión: el capataz abre la app y entra. -->
  <div id="sesionBox" data-estilo="display:none;">
    <button class="btn" id="btnSesion" data-on-click="continuarSesion()">CONTINUAR →</button>
    <button class="btn btn-sec" data-on-click="otraCuenta()">Entrar con otra cuenta</button>
  </div>
  <div id="formBox">
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="usuario" placeholder="tu usuario" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="clave" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="btnLogin" data-on-click="login()">INGRESAR →</button>
  </div>
  <div class="error" id="errorMsg">Usuario o contraseña incorrectos</div>
  <div class="divider"></div>
  <div class="pie">
    <div class="version">Sistema de Reporte v2.0
      <span class="autoria">Desarrollado por <b>C&eacute;sar Sandino</b></span>
    </div>
    <!-- tema.js monta aquí el interruptor. Antes quedaba flotando en una esquina
         y tapaba la marca «TM2 SUR» en pantalla ancha. -->
    <div id="tm2-tema-slot"></div>
  </div>
</div>
</div>
<script src="index.js"></script>
</body>
</html>
