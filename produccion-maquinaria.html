<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.galca.app; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquinaria</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="auth.js"></script>
<script src="entorno.js"></script>
<script src="tema.js"></script>
<link rel="stylesheet" href="produccion-maquinaria.css">
</head>
<body>
<div class="header">
  <span class="galca-simbolo" role="img" aria-label="Galca"></span>
  <div class="header-left">
    <div class="label" id="headerLabel">Maquinaria</div>
    <h1>⚙️ Maquinaria</h1>
  </div>
  <div class="header-user">
    <span id="userDisplay">—</span>
    <button class="logout-btn btn-volver" id="btnMenu" data-on-click="irA('menu.html')" data-estilo="display:none;">← Menú</button>
    <button class="logout-btn" data-on-click="logout()">Salir</button>
  </div>
</div>

<div class="container" id="contenedor">
  <!-- D139: dos pestañas sobre el mismo modelo de datos. D194: «Producción del día» desactivada (no se
       usa); la pantalla abre en la Flota y esta barra se oculta desde el JS. -->
  <div class="tabs" data-estilo="display:none">
    <button class="tab active" id="tabProd"  data-on-click="verTab('prod')">Producción del día</button>
    <button class="tab"        id="tabFlota" data-on-click="verTab('flota')">Flota</button>
  </div>

  <div id="panelProd" data-estilo="display:none">
    <div class="filtro-card">
      <div class="filtro-row">
        <div class="field"><label>Fecha</label><input type="date" id="fecha"></div>
        <button class="btn-consultar" data-on-click="consultar()">CONSULTAR →</button>
      </div>
    </div>
    <div id="resultados">
      <div class="empty-state"><div class="icon">⚙️</div><p>Selecciona una fecha para ver el panorama de producción del día.</p></div>
    </div>
  </div>

  <div id="panelFlota">
    <!-- Cabecera (resumen, avisos, alta, buscador) y LISTA van en dos contenedores: el buscador
         filtra repintando solo la lista, así el campo no pierde el foco a cada tecla. -->
    <div id="flotaCont"><div class="loading">⏳ Cargando la flota...</div></div>
    <div id="flotaLista"></div>
  </div>
</div>

<div class="qr-modal hidden" id="qrModal" data-on-click="flQRFondo(event,this)">
  <div class="qr-box">
    <button class="qr-x" data-on-click="flCerrarQR()" aria-label="Cerrar">✕</button>
    <div id="qrCuerpo"></div>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="produccion-maquinaria.js"></script>
</body>
</html>
